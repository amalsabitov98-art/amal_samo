<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" width="260" height="150" role="img" aria-label="Etihad">
  <!--
    Знак для туристической компании «Etihad» (умра, хадж и авторские туры).
    Собственный, НЕ авиакомпании: у той — плавный двойной изгиб и свой
    шрифт wordmark'а. Здесь другая идея и другая пластика.

    Смысл: اتحاد — «единство». Две дуги выходят порознь и сходятся в одну
    вершину; в точке схождения — восьмиконечная звезда (рубʼ аль-хизб),
    традиционный исламский мотив, уместный для умры и хаджа и понятный
    без пояснений. Форма геометрическая и симметричная — намеренно
    противоположна текучему изгибу авиакомпании.

    Палитра — та же, что на бланках: лесной зелёный и латунь.
  -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbab52"/>
      <stop offset="1" stop-color="#957823"/>
    </linearGradient>
  </defs>

  <!-- левая дуга -->
  <path d="M62 96 C62 58, 92 34, 130 34" fill="none" stroke="#14432c"
        stroke-width="13" stroke-linecap="round"/>
  <!-- правая дуга -->
  <path d="M198 96 C198 58, 168 34, 130 34" fill="none" stroke="url(#brass)"
        stroke-width="13" stroke-linecap="round"/>

  <!-- звезда в точке схождения -->
  <g transform="translate(130 34)">
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#14432c"
          transform="rotate(0)"/>
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#14432c"
          transform="rotate(45)"/>
    <rect x="-6.5" y="-6.5" width="13" height="13" rx="1.5" fill="#cbab52"
          transform="rotate(45)"/>
  </g>

  <!-- основание: сходящиеся дуги стоят на общей линии -->
  <rect x="62" y="92" width="136" height="7" rx="3.5" fill="url(#brass)"/>

  <!-- слово: без разрядки авиакомпании, другой строй -->
  <text x="130" y="132" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="30"
        font-weight="700" letter-spacing="1.5" fill="#14432c">ETIHAD</text>
</svg>
