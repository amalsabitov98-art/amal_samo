<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Turon Tour — авторские туры</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="tt-header">
  <div class="tt-logo">Turon <span>Tour</span></div>
  <div class="tt-muted-note">Авторские туры</div>
</header>

<main class="tt-container">
  <div class="tt-tabs">
    <button class="tt-tab is-active" data-tab="tours">Туры</button>
    <button class="tt-tab" data-tab="excursions">Экскурсии</button>
  </div>

  <section id="panel-tours">
    <form class="tt-search-panel" id="search-form">
      <div class="tt-field">
        <label for="f-query">Направление или название тура</label>
        <input type="text" id="f-query" placeholder="Например, Токио" />
      </div>
      <div class="tt-field">
        <label for="f-country">Страна</label>
        <select id="f-country">
          <option value="">Все страны</option>
        </select>
      </div>
      <div class="tt-field">
        <label for="f-date">Заезд не раньше</label>
        <input type="date" id="f-date" />
      </div>
      <button type="submit" class="tt-btn">Найти</button>
    </form>

    <div class="tt-results-grid" id="tours-grid"></div>
  </section>

  <section id="panel-excursions" hidden>
    <div class="tt-results-grid" id="excursions-grid"></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/pricing.js"></script>
<script src="js/search.js"></script>
</body>
</html>
