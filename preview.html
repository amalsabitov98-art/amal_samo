<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d302a" />
<title>Turon Tour — кабинет агентства (превью)</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("turon.theme");
      document.documentElement.setAttribute(
        "data-theme", saved === "light" ? "light" : "dark");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
    try {
      if (localStorage.getItem("turon.app-theme") === "dark") {
        document.documentElement.setAttribute("data-app-theme", "dark");
      }
    } catch (e) {}
  })();
</script>
<style>
/* ----------------------------------------------------------------- темы
   Здесь раньше жили четыре блока: :root со старой палитрой,
   @media (prefers-color-scheme: dark) и :root[data-theme="dark"/"light"].
   Все они перекрывались настоящим :root ниже, поэтому годами были мертвы
   и никто этого не замечал.

   Как только data-theme стал осмысленным (кнопка день/ночь), блок
   :root[data-theme="dark"] ожил — его специфичность (0,2,0) выше, чем у
   обычного :root (0,1,0), — и перекрасил ВЕСЬ сайт, включая кабинет, в
   старую коричневую палитру: логотип перевозчика пропадал, даты уходили
   в нечитаемое. Удалены целиком.

   Теперь единственный источник палитры — :root ниже, а data-theme влияет
   только на то, что явно на него завязано (тёмная публичная часть). */

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--tt-bg);
  color: var(--tt-text);
  line-height: 1.45;
}

a { color: inherit; }

.tt-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  background: var(--tt-surface);
  border-bottom: 1px solid var(--tt-border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.tt-logo {
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: 0.02em;
}
.tt-logo span { color: var(--tt-accent); }

.tt-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

.tt-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--tt-border);
}

.tt-tab {
  padding: 10px 18px;
  border: none;
  background: none;
  color: var(--tt-text-muted);
  font-size: 0.95rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tt-tab.is-active {
  color: var(--tt-accent);
  border-bottom-color: var(--tt-accent);
  font-weight: 600;
}

.tt-field label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 6px;
}

.tt-field input,
.tt-field select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

.tt-btn {
  border: none;
  border-radius: 9px;
  padding: 10px 20px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--tt-accent);
  color: #fff;
  transition: background 0.15s ease;
}
.tt-btn:hover { background: var(--tt-accent-dark); }
.tt-btn.secondary {
  background: transparent;
  color: var(--tt-accent);
  border: 1px solid var(--tt-accent);
}
.tt-btn.secondary:hover { background: var(--tt-accent-soft); }
.tt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.tt-badge {
  display: inline-block;
  font-size: 0.72rem;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--tt-accent-soft);
  color: var(--tt-accent-dark);
  width: fit-content;
}

.tt-empty-state {
  text-align: center;
  color: var(--tt-text-muted);
  padding: 60px 20px;
}

/* ======================= Кабинет агентства ======================= */

.tt-btn-sm { padding: 7px 14px; font-size: 0.85rem; }

.tt-muted-note { font-size: 0.8rem; color: var(--tt-text-muted); }

.tt-field-full { margin-bottom: 14px; text-align: left; }
.tt-field-full label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 5px;
}
.tt-field-full input,
.tt-field-full select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

.tt-error-box {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid #d9a49e;
  background: #fbecea;
  color: #8d3229;
  font-size: 0.85rem;
  text-align: left;
}
/* Тёмный вариант — только на тёмных экранах (вход и публичная часть в
   ночной теме). Раньше он висел на :root[data-theme] и, когда data-theme
   стал осмысленным, полез бы в кремовый кабинет. Системную тему тут тоже
   не слушаем: оформление выбирает кнопка, а не настройки ОС. */
#screen-login .tt-error-box,
:root:not([data-theme="light"]) #screen-public .tt-error-box {
  border-color: #6b3b35;
  background: #3a211e;
  color: #f0bdb6;
}

/* ------------------------------------------------------------- вход */
.tt-login-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.tt-login-card {
  width: 100%;
  max-width: 360px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 32px 28px;
  text-align: center;
}
.tt-login-card .tt-muted-note { margin: 4px 0 22px; }
.tt-login-card .tt-btn { width: 100%; }
.tt-login-card #demo-hint {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--tt-border);
  line-height: 1.7;
}

/* -------------------------------------------------------- фильтры */
.tt-toolbar {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.tt-toolbar .tt-field { min-width: 190px; }
.tt-check-inline {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.88rem;
  color: var(--tt-text-muted);
  padding-bottom: 10px;
  cursor: pointer;
}

/* --------------------------------------------------------- заезды */
.tt-dep {
  display: grid;
  grid-template-columns: 190px 1fr 170px 150px;
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-left: 3px solid var(--tt-success);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
.tt-dep.is-low { border-left-color: var(--tt-warn-border); }
.tt-dep.is-full { border-left-color: var(--tt-border); opacity: 0.62; }

@media (max-width: 860px) {
  .tt-dep { grid-template-columns: 1fr; gap: 12px; }
}

.tt-dep-date strong { font-size: 1.05rem; display: block; }
.tt-dep-code {
  font-size: 0.75rem;
  color: var(--tt-text-muted);
  font-variant-numeric: tabular-nums;
}
.tt-dep-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tt-badge-info { background: var(--tt-warn-bg); color: var(--tt-warn-text); }
.tt-badge-off { background: var(--tt-border); color: var(--tt-text-muted); }

.tt-dep-prices { display: flex; flex-wrap: wrap; gap: 6px; }
.tt-price-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--tt-bg);
  border: 1px solid var(--tt-border);
  font-variant-numeric: tabular-nums;
}
.tt-price-chip em {
  font-style: normal;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--tt-text-muted);
  letter-spacing: 0.04em;
}
.tt-child-prices {
  flex-basis: 100%;
  font-size: 0.76rem;
  color: var(--tt-text-muted);
  margin-top: 2px;
}

.tt-seat-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--tt-border);
  overflow: hidden;
  margin-bottom: 6px;
}
.tt-seat-bar i { display: block; height: 100%; background: var(--tt-accent); }
.tt-seat-text { font-size: 0.82rem; color: var(--tt-text-muted); }
.tt-dep-action { text-align: right; }
.tt-dep-action .tt-btn { width: 100%; }

/* ------------------------------------------------------ мои брони */
.tt-booking {
  display: grid;
  grid-template-columns: 1fr 260px 130px;
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
@media (max-width: 780px) {
  .tt-booking { grid-template-columns: 1fr; }
}
.tt-booking.is-cancelled { opacity: 0.55; }
.tt-booking-main { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.tt-booking-action { text-align: right; }

.tt-sum-line {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 0.85rem;
  color: var(--tt-text-muted);
  padding: 2px 0;
  font-variant-numeric: tabular-nums;
}
.tt-sum-line.tt-owed strong { color: var(--tt-warn-text); }
.tt-sum-total {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 1.1rem;
  font-weight: 700;
  padding-top: 8px;
  margin-top: 6px;
  border-top: 1px solid var(--tt-border);
  font-variant-numeric: tabular-nums;
}

/* ----------------------------------------------------- бронирование */
/* hidden не скрывает элемент, которому задан display — явный display
   выигрывает. Ловилось дважды: невидимое окно брони перехватывало клики,
   а экран входа оставался поверх кабинета. Правило общее, чтобы не
   наступить снова при добавлении новых блоков с display. */
[hidden] { display: none !important; }

.tt-modal {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 10, 0.55);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 50;
}
.tt-modal-card {
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}
.tt-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--tt-border);
}
.tt-modal-head h2 { margin: 0 0 2px; font-size: 1.15rem; }
.tt-modal-body { padding: 18px 22px; overflow-y: auto; }
.tt-modal-foot {
  padding: 16px 22px;
  border-top: 1px solid var(--tt-border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.tt-modal-foot > div { flex: 1; min-width: 220px; }

.tt-icon-btn {
  border: none;
  background: none;
  color: var(--tt-text-muted);
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}
.tt-icon-btn:hover { color: var(--tt-text); }

.tt-pax {
  border: 1px solid var(--tt-border);
  border-radius: 11px;
  padding: 14px;
  margin-bottom: 12px;
}
.tt-pax-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.92rem;
}
.tt-pax-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tt-pax-grid .tt-col-2 { grid-column: span 2; }
@media (max-width: 560px) {
  .tt-pax-grid { grid-template-columns: 1fr; }
  .tt-pax-grid .tt-col-2 { grid-column: span 1; }
}
.tt-pax-grid label {
  display: block;
  font-size: 0.74rem;
  color: var(--tt-text-muted);
  margin-bottom: 4px;
}
.tt-pax-grid input,
.tt-pax-grid select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.88rem;
}
.tt-pax-price {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--tt-border);
  font-size: 0.85rem;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.tt-pax-tariff { color: var(--tt-text-muted); }
.tt-price-warn { color: var(--tt-warn-text); }

/* ------------------------------------------------------ уведомление */
.tt-flash {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  background: var(--tt-text);
  color: var(--tt-bg);
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 0.88rem;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
  z-index: 80;
  transition: opacity 0.5s ease;
}
.tt-flash.is-out { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .tt-flash { transition: none; }
}

/* ------------------------------------------------ комиссии и заработок */
.tt-earn strong, .tt-earn-value { color: var(--tt-success); }
.tt-owed-value { color: var(--tt-warn-text); }

.tt-earnings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 18px 20px;
  margin-bottom: 18px;
}
.tt-earnings > div { display: flex; flex-direction: column; gap: 2px; }
.tt-earnings span { font-size: 0.8rem; color: var(--tt-text-muted); }
.tt-earnings strong { font-size: 1.35rem; font-variant-numeric: tabular-nums; }

.tt-tour {
  display: grid;
  grid-template-columns: 1fr 170px minmax(110px, auto);
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 10px;
}
@media (max-width: 700px) {
  .tt-tour { grid-template-columns: 1fr; gap: 10px; }
}
.tt-tour.is-pending { opacity: 0.72; }
.tt-tour-commission { display: flex; flex-direction: column; }
.tt-tour-commission .tt-earn-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ==================== Сторона оператора ==================== */

.tt-ok-box {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-success);
  background: var(--tt-accent-soft);
  color: var(--tt-success);
  font-size: 0.85rem;
}

.tt-panel {
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 20px;
  margin-bottom: 20px;
}
.tt-panel h2 { margin: 0 0 14px; font-size: 1.05rem; }

.tt-new-agency-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr auto;
  gap: 12px;
  align-items: end;
}
@media (max-width: 780px) {
  .tt-new-agency-grid { grid-template-columns: 1fr; }
}
.tt-new-agency-grid label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 5px;
}
.tt-new-agency-grid input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

/* Таблица широкая — прокручиваем её саму, страница вбок не едет */
.tt-table-wrap {
  overflow-x: auto;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
}
.tt-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.84rem;
  white-space: nowrap;
}
.tt-table th,
.tt-table td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--tt-border);
}
.tt-table th {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--tt-text-muted);
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--tt-surface);
}
.tt-table tbody tr:last-child td { border-bottom: none; }
.tt-table tbody tr:hover { background: var(--tt-bg); }
.tt-table td:nth-child(11) { font-variant-numeric: tabular-nums; text-align: right; }

.tt-agency-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.tt-history {
  grid-column: 1 / -1;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--tt-border);
  display: grid;
  gap: 4px;
}
.tt-history-row {
  display: grid;
  grid-template-columns: 130px 130px 1fr 1fr;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--tt-text-muted);
  font-variant-numeric: tabular-nums;
}
.tt-history-row strong { color: var(--tt-text); font-weight: 600; }
@media (max-width: 700px) {
  .tt-history-row { grid-template-columns: 1fr 1fr; }
}

/* ------------------------------------------------------------- каталог */
/* Публичный каталог направлений и карточка тура. Оформление собрано на
   тех же токенах, что и кабинет, поэтому обе темы работают сами. */

.tt-link-btn {
  background: none;
  border: 0;
  padding: 6px 0 0;
  color: var(--tt-text-muted);
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  text-align: center;
}
.tt-link-btn:hover { color: var(--tt-accent); }

.tt-crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 0.85rem;
  color: var(--tt-text-muted);
}
.tt-crumbs i { font-style: normal; opacity: 0.5; }
.tt-crumb {
  background: none;
  border: 0;
  padding: 0;
  color: var(--tt-accent);
  font: inherit;
  cursor: pointer;
}
.tt-crumb:hover { text-decoration: underline; }

.tt-cat-h1 {
  margin: 0 0 18px;
  font-size: 1.5rem;
  letter-spacing: -0.01em;
}

/* --- плитки направлений --- */
.tt-cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.tt-cat-tile {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  text-align: left;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  cursor: pointer;
  font: inherit;
  color: var(--tt-text);
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.tt-cat-tile:hover { transform: translateY(-2px); border-color: var(--tt-accent); }
.tt-cat-tile.is-soon { opacity: 0.75; }
.tt-cat-tile-art {
  display: block;
  height: 116px;
  background-color: var(--tt-accent-soft);
  background-image: linear-gradient(135deg, var(--tt-accent-soft), var(--tt-border));
  background-size: cover;
  background-position: center;
}
.tt-cat-tile-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px 16px;
}
.tt-cat-tile-body strong { font-size: 1.05rem; }
.tt-cat-tile-foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--tt-text-muted);
}
.tt-cat-tile-foot em {
  font-style: normal;
  font-weight: 600;
  color: var(--tt-accent);
  font-variant-numeric: tabular-nums;
}

/* --- список туров направления --- */
.tt-cat-tours { display: grid; gap: 14px; }
.tt-cat-tour {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  align-items: start;
  padding: 18px 20px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
}
.tt-cat-tour.is-soon { opacity: 0.8; }
.tt-cat-tour h3 { margin: 0 0 4px; font-size: 1.1rem; }
.tt-cat-tour p { margin: 8px 0 0; font-size: 0.9rem; line-height: 1.5; }
.tt-cat-tour-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.tt-cat-from { text-align: right; line-height: 1.15; }
.tt-cat-from span { display: block; font-size: 0.75rem; color: var(--tt-text-muted); }
.tt-cat-from strong {
  font-size: 1.25rem;
  color: var(--tt-accent);
  font-variant-numeric: tabular-nums;
}
@media (max-width: 640px) {
  .tt-cat-tour { grid-template-columns: 1fr; }
  .tt-cat-tour-side { flex-direction: row; align-items: center; justify-content: space-between; }
}

/* --- карточка тура --- */
.tt-cat-hero {
  padding: 22px 24px;
  margin-bottom: 18px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
}
.tt-cat-hero h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: -0.01em; }
.tt-cat-hero p { margin: 12px 0 0; line-height: 1.6; max-width: 68ch; }

.tt-cat-block {
  padding: 20px 24px;
  margin-bottom: 18px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
}
.tt-cat-block > h2 { margin: 0 0 14px; font-size: 1.1rem; }

.tt-cat-variants { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.tt-cat-variant {
  padding: 8px 14px;
  background: var(--tt-bg);
  border: 1px solid var(--tt-border);
  border-radius: 999px;
  font: inherit;
  font-size: 0.85rem;
  color: var(--tt-text-muted);
  cursor: pointer;
}
.tt-cat-variant:hover { border-color: var(--tt-accent); color: var(--tt-text); }
.tt-cat-variant.is-active {
  background: var(--tt-accent-soft);
  border-color: var(--tt-accent);
  color: var(--tt-text);
  font-weight: 600;
}

.tt-cat-days { margin: 16px 0 0; padding: 0; list-style: none; }
.tt-cat-days li {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--tt-border);
}
.tt-cat-days li:first-child { border-top: 0; padding-top: 4px; }
.tt-cat-days strong { font-size: 0.95rem; }
.tt-cat-days span { font-size: 0.9rem; line-height: 1.55; color: var(--tt-text-muted); }
@media (max-width: 640px) {
  .tt-cat-days li { grid-template-columns: 1fr; gap: 4px; }
}

.tt-cat-lists {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}
.tt-cat-list h3 { margin: 0 0 10px; font-size: 0.95rem; }
.tt-cat-list ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tt-cat-list li {
  position: relative;
  padding-left: 22px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.tt-cat-list li::before {
  position: absolute;
  left: 0;
  top: 0;
  font-weight: 700;
}
.tt-cat-list.is-in li::before { content: "+"; color: var(--tt-success); }
.tt-cat-list.is-out li::before { content: "−"; color: var(--tt-text-muted); }
.tt-cat-list.is-out li { color: var(--tt-text-muted); }

.tt-cat-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.tt-cat-gallery img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--tt-border);
}

.tt-cat-info { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.tt-cat-info li { font-size: 0.9rem; line-height: 1.5; color: var(--tt-text-muted); }
.tt-cat-info a { color: var(--tt-accent); }

/* --- заезды в карточке тура --- */
.tt-cat-deps { display: grid; gap: 10px; }
.tt-cat-dep {
  display: grid;
  grid-template-columns: 200px 1fr 130px auto;
  gap: 16px;
  align-items: center;
  padding: 14px 16px;
  background: var(--tt-bg);
  border: 1px solid var(--tt-border);
  border-radius: 12px;
}
.tt-cat-dep-when { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.tt-cat-dep-when strong { font-size: 1rem; }
.tt-cat-dep-prices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tt-cat-dep-seats {
  font-size: 0.85rem;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.tt-cat-dep-seats.is-ok { color: var(--tt-success); }
.tt-cat-dep-seats.is-low { color: var(--tt-warn-text); }
.tt-cat-dep-seats.is-full { color: var(--tt-text-muted); font-weight: 500; }
.tt-cat-dep-action { display: flex; justify-content: flex-end; min-width: 0; }
@media (max-width: 820px) {
  /* Дата и остаток — в одну строку, цены и кнопка — на всю ширину:
     иначе в узкой колонке каждый ценник встаёт отдельной строкой. */
  .tt-cat-dep { grid-template-columns: 1fr auto; gap: 10px 12px; }
  .tt-cat-dep-when { grid-area: 1 / 1; }
  .tt-cat-dep-seats { grid-area: 1 / 2; align-self: start; }
  .tt-cat-dep-prices { grid-column: 1 / -1; }
  .tt-cat-dep-action { grid-column: 1 / -1; justify-content: flex-start; }
}

/* --------------------------------------- калькулятор заезда и оплата */
/* Раскрывается под строкой заезда: счётчики по тарифам, итог и сроки
   оплаты. Агент называет клиенту сумму, не заполняя паспорта. */

.tt-cat-dep.is-open {
  border-color: var(--tt-accent);
  background: var(--tt-surface);
}
.tt-cat-calc {
  grid-column: 1 / -1;
  margin-top: 4px;
  padding-top: 14px;
  border-top: 1px solid var(--tt-border);
}

.tt-calc-row {
  display: grid;
  grid-template-columns: 1fr 90px 118px 90px;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
}
.tt-calc-row + .tt-calc-row { border-top: 1px dashed var(--tt-border); }
.tt-calc-what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tt-calc-what strong { font-size: 0.9rem; }
.tt-calc-price,
.tt-calc-sum {
  font-size: 0.9rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.tt-calc-price { color: var(--tt-text-muted); }
.tt-calc-sum { font-weight: 600; }

.tt-calc-stepper {
  display: inline-flex;
  align-items: center;
  justify-self: center;
  border: 1px solid var(--tt-border);
  border-radius: 999px;
  background: var(--tt-bg);
  overflow: hidden;
}
.tt-calc-stepper button {
  width: 34px;
  height: 32px;
  border: 0;
  background: none;
  color: var(--tt-accent);
  font: inherit;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
}
.tt-calc-stepper button:hover:not(:disabled) { background: var(--tt-accent-soft); }
.tt-calc-stepper button:disabled { color: var(--tt-border); cursor: default; }
.tt-calc-stepper output {
  min-width: 34px;
  text-align: center;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.tt-calc-total {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  align-items: baseline;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--tt-border);
  font-size: 0.85rem;
}
.tt-calc-total span { color: var(--tt-text-muted); margin-right: 6px; }
.tt-calc-total strong { font-variant-numeric: tabular-nums; }
.tt-calc-grand { margin-left: auto; font-size: 1rem; }
.tt-calc-grand strong { color: var(--tt-accent); font-size: 1.2rem; }

.tt-calc-actions { margin-top: 14px; }

.tt-cat-policy {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--tt-warn-bg);
  border: 1px solid var(--tt-warn-border);
  border-radius: 10px;
}
.tt-cat-policy h4 {
  margin: 0 0 8px;
  font-size: 0.85rem;
  color: var(--tt-warn-text);
}
.tt-cat-policy ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tt-cat-policy li { font-size: 0.85rem; line-height: 1.45; }
.tt-cat-policy strong { font-variant-numeric: tabular-nums; }
.tt-cat-policy p { margin: 8px 0 0; }
.tt-cat-policy.is-urgent { border-color: var(--tt-accent); }

@media (max-width: 640px) {
  .tt-calc-row {
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
  }
  .tt-calc-price { text-align: left; grid-row: 2; }
  .tt-calc-stepper { justify-self: end; grid-row: 1 / 3; grid-column: 2; }
  .tt-calc-sum { display: none; }
  .tt-calc-grand { margin-left: 0; }
}

/* ==================================================================
   PARTNER HUB
   Премиальная travel-tech оболочка Turon Tour. Нижние правила намеренно
   переопределяют прежнюю тему, не затрагивая DOM-контракты приложения.
   ================================================================== */

:root {
  --tt-bg: #f4f1e9;
  --tt-surface: #fffdf8;
  --tt-surface-2: #f9f6ef;
  --tt-border: rgba(16, 55, 47, 0.14);
  --tt-border-strong: rgba(16, 55, 47, 0.24);
  --tt-text: #172923;
  --tt-text-muted: #6b7771;
  /* был объявлен только в тёмной публичной палитре — в светлой
     теме var(--tt-text-subtle) не разрешался вообще */
  --tt-text-subtle: #8d968f;
  --tt-accent: #e9653a;
  --tt-accent-dark: #c94925;
  --tt-accent-soft: #fae9e2;
  --tt-forest: #0d302a;
  --tt-forest-deep: #08241f;
  --tt-forest-soft: #17463c;
  --tt-cream: #f4f1e9;
  --tt-success: #16805f;
  --tt-success-soft: #e6f3ed;
  --tt-warn-bg: #fff4dc;
  --tt-warn-border: #e9bd69;
  --tt-warn-text: #8b5c0d;
  --tt-danger: #c95145;
  --tt-radius: 14px;
  --tt-radius-lg: 22px;
  --tt-shadow: 0 10px 34px rgba(24, 45, 38, 0.07);
  --tt-shadow-hover: 0 18px 48px rgba(15, 48, 40, 0.13);
  color-scheme: light;
}

/* ======================================================================
   Тёмная тема КАБИНЕТА — отдельная от публичной (data-app-theme на <html>).
   По умолчанию её нет: кабинет кремовый, как привыкли агентства. Тёмная
   включается кнопкой в шапке кабинета и хранится в turon.app-theme.

   Скоуп строго на #screen-app: публичную часть не трогаем. Осветляем
   переменные-поверхности и текст. --tt-forest раньше был тёмным ТЕКСТОМ —
   делаем его светлым; --tt-forest-deep/-soft остаются тёмными, потому что
   ими крашены ФОНЫ (сайдбар, зелёные плашки, аватар) — их осветлять нельзя.
   ====================================================================== */
:root[data-app-theme="dark"] #screen-app {
  /* Само свойство color, а не только переменную: body держит тёмный
     color:var(--tt-text) из базовой темы (он вне скоупа), и элементы без
     явного цвета — например <strong> в карточках — наследовали бы тёмный
     текст на тёмном фоне. Здесь задаём светлый ambient для всего кабинета. */
  color: var(--tt-text);
  --tt-bg: #0d1c16;
  --tt-surface: #14261e;
  --tt-surface-2: #182d23;
  --tt-border: rgba(203, 171, 82, 0.16);
  --tt-border-strong: rgba(203, 171, 82, 0.30);
  --tt-text: #e9efe8;
  --tt-text-muted: #a2b2a7;
  --tt-text-subtle: #7e8d84;
  /* был тёмный текст на кремовом → на тёмном фоне делаем светлым */
  --tt-forest: #eef3ec;
  --tt-cream: #0d1c16;
  --tt-accent-soft: rgba(233, 101, 58, 0.16);
  --tt-success-soft: rgba(22, 128, 95, 0.20);
  --tt-warn-bg: rgba(233, 189, 105, 0.14);
  --tt-warn-text: #e6c060;
  --tt-warn-border: rgba(233, 189, 105, 0.4);
  --tt-shadow: 0 12px 34px rgba(0, 0, 0, 0.4);
  --tt-shadow-hover: 0 18px 48px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

/* Точечные правки тёмного кабинета: места, где цвет фона был зашит кремом
   (переменные их не покрывают). Всё скоупнуто на data-app-theme=dark. */
:root[data-app-theme="dark"] #screen-app .tt-app-header {
  background: rgba(10, 24, 18, 0.86);
  border-bottom-color: rgba(203, 171, 82, 0.14);
}
/* Плашки в шапке (курс, TG, колокольчик, аккаунт) — общий кремовый «жетон»
   с золотой рамкой, белым внутренним кантом и бликом. На тёмной панели
   светились. Делаем тёмными полупрозрачными и гасим белые канты/блик. */
:root[data-app-theme="dark"] #screen-app .tt-app-currency,
:root[data-app-theme="dark"] #screen-app .tt-app-tg,
:root[data-app-theme="dark"] #screen-app .tt-notice-btn,
:root[data-app-theme="dark"] #screen-app .tt-top-account {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(203, 171, 82, 0.18);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}
:root[data-app-theme="dark"] #screen-app .tt-app-currency::before,
:root[data-app-theme="dark"] #screen-app .tt-app-tg::before,
:root[data-app-theme="dark"] #screen-app .tt-notice-btn::before,
:root[data-app-theme="dark"] #screen-app .tt-top-account::before { display: none; }
:root[data-app-theme="dark"] #screen-app .tt-app-currency strong { color: var(--tt-text); }
/* Иконка колокольчика была тёмно-зелёной — на тёмном фоне светлим. */
:root[data-app-theme="dark"] #screen-app .tt-notice-btn { color: #e9efe8; }
:root[data-app-theme="dark"] #screen-app .tt-notice-btn svg { stroke: #e9efe8; }
/* Ховер строк таблиц был затемнением (rgba(13,48,42,..)) — на тёмном фоне
   не виден; заменяем на лёгкое высветление. */
:root[data-app-theme="dark"] #screen-app .tt-table tbody tr:hover {
  background: rgba(255, 255, 255, 0.05);
}
/* Панель поиска/фильтра (.tt-toolbar) была кремовой (rgba(255,253,248,..)) —
   на тёмном светилась светло-серым пятном. Делаем тёмной. */
:root[data-app-theme="dark"] #screen-app .tt-toolbar {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--tt-border);
}
/* Табло курса в шапке кабинета: подпись и цифры были зашиты тёмно-зелёным
   (#173c35 / #082f29) — на тёмной панели не читались. Светлим. */
:root[data-app-theme="dark"] #screen-app .tt-app-currency .tt-tool-copy > small {
  color: var(--tt-text-muted);
}
:root[data-app-theme="dark"] #screen-app .tt-rate-row,
:root[data-app-theme="dark"] #screen-app .tt-rate-row b,
:root[data-app-theme="dark"] #screen-app .tt-rate-row strong { color: var(--tt-text); }
:root[data-app-theme="dark"] #screen-app .tt-tool-icon { color: var(--tt-warn-text); }
/* Имя агентства в шапке тоже было зашито тёмным (#082f29 / #806a42). */
:root[data-app-theme="dark"] #screen-app .tt-top-account-name strong { color: var(--tt-text); }
:root[data-app-theme="dark"] #screen-app .tt-top-account-name small { color: var(--tt-text-muted); }
/* Плашки шапки чуть заметнее, чтобы читались как отдельные жетоны. */
:root[data-app-theme="dark"] #screen-app .tt-app-currency,
:root[data-app-theme="dark"] #screen-app .tt-app-tg,
:root[data-app-theme="dark"] #screen-app .tt-notice-btn,
:root[data-app-theme="dark"] #screen-app .tt-top-account {
  background: rgba(255, 255, 255, 0.07);
}

/* ======================================================================
   Тёмная тема публичной части (референс — тёмный сайт туров с бирюзой).
   Скоуп именно на #screen-public, а не на :root: кабинет остаётся светлым,
   агентства к нему привыкли, и перекрашивать его никто не просил.
   Почти всё внутри уже ходит через var(--tt-*), поэтому переопределения
   переменных хватает — руками ниже правим только то, где цвет был зашит.

   Правила навешены через :root:not([data-theme="light"]): «день» просто
   перестаёт их применять, и снизу проступает базовое кремовое оформление,
   которое никуда не девалось. Красить поверх ничего не нужно.
   ====================================================================== */
:root:not([data-theme="light"]) #screen-public {
  --tt-bg: #070b0d;
  --tt-surface: #0f1619;
  --tt-surface-2: #131c20;
  --tt-border: rgba(122, 200, 214, 0.15);
  --tt-border-strong: rgba(122, 200, 214, 0.28);
  --tt-text: #e9f3f6;
  --tt-text-muted: #93a8b0;
  --tt-text-subtle: #6d818a;
  --tt-accent: #4fd6e8;
  --tt-accent-dark: #7fe4f2;
  --tt-accent-soft: rgba(79, 214, 232, 0.13);
  --tt-forest: #0a1417;
  --tt-forest-deep: #05090b;
  --tt-forest-soft: #12232a;
  --tt-success: #4fd6a0;
  --tt-success-soft: rgba(79, 214, 160, 0.13);
  --tt-warn-bg: rgba(233, 189, 105, 0.12);
  --tt-warn-border: rgba(233, 189, 105, 0.34);
  --tt-warn-text: #e9bd69;
  --tt-danger: #ef6a5c;
  --tt-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
  --tt-shadow-hover: 0 18px 48px rgba(0, 0, 0, 0.62);
  color: var(--tt-text);
  color-scheme: dark;
  min-height: 100vh;
}
/* Ниже по файлу у #screen-public свой фон — кремовый градиент с золотым
   отсветом. Он объявлен позже, поэтому перебиваем специфичностью (body +
   id), а не порядком: декоративный отсвет оставляем, но в бирюзе. */
:root:not([data-theme="light"]) #screen-public {
  background:
    radial-gradient(circle at 84% 8%, rgba(79, 214, 232, 0.1), transparent 24rem),
    linear-gradient(180deg, #080e11 0%, var(--tt-bg) 42%, #05090b 100%);
}

/* Бирюза светлая: белый текст на ней не читается, поэтому в публичной
   части у заливных кнопок текст тёмный. */
:root:not([data-theme="light"]) #screen-public .tt-btn,
#screen-public .tt-hero-search-btn { color: #05252a; }
:root:not([data-theme="light"]) #screen-public .tt-btn.secondary {
  background: transparent;
  border: 1px solid var(--tt-border-strong);
  color: var(--tt-text);
}
:root:not([data-theme="light"]) #screen-public .tt-btn.secondary:hover {
  border-color: var(--tt-accent);
  color: var(--tt-accent);
}

/* Шапка и поднавигация были кремовыми — единственное светлое пятно. */
:root:not([data-theme="light"]) #screen-public .tt-public-header {
  border-bottom-color: var(--tt-border);
  background: rgba(7, 11, 13, 0.92);
}
:root:not([data-theme="light"]) #screen-public .tt-public-subnav {
  border-bottom-color: var(--tt-border);
  background: rgba(10, 16, 19, 0.86);
}
:root:not([data-theme="light"]) #screen-public .tt-public-subnav button:hover,
:root:not([data-theme="light"]) #screen-public .tt-public-subnav button.is-active {
  border-color: var(--tt-border-strong);
  background: rgba(79, 214, 232, 0.1);
  color: var(--tt-accent);
}
#screen-public .tt-logo-mark { filter: brightness(1.15); }

/* Плашки шапки были кремовыми: табло курсов, выбор языка, кнопка входа и
   подложка под эмблемой. На чёрном они светились тремя белыми пятнами. */
:root:not([data-theme="light"]) #screen-public .tt-currency-board {
  border-color: var(--tt-border);
  background: rgba(255, 255, 255, 0.05);
}
#screen-public .tt-currency-board strong { color: var(--tt-text); }
#screen-public .tt-currency-board b { color: #fff; }
:root:not([data-theme="light"]) #screen-public .tt-lang-btn {
  border-color: var(--tt-border);
  background-color: rgba(255, 255, 255, 0.05);
  color: var(--tt-text);
}
/* Меню на тёмной теме — тёмная плашка с читаемым светлым текстом (раньше
   именно оно было белым системным с невидимыми пунктами). */
:root:not([data-theme="light"]) #screen-public .tt-lang-menu {
  background: #10201b;
  border-color: var(--tt-border);
}
:root:not([data-theme="light"]) #screen-public .tt-lang-opt { color: var(--tt-text); }
:root:not([data-theme="light"]) #screen-public .tt-lang-opt:hover,
:root:not([data-theme="light"]) #screen-public .tt-lang-opt[aria-selected="true"] {
  background: rgba(255, 255, 255, 0.1);
}
:root:not([data-theme="light"]) #screen-public .tt-account-btn {
  border-color: var(--tt-border-strong);
  background: transparent;
  color: var(--tt-text);
}
:root:not([data-theme="light"]) #screen-public .tt-account-btn:hover {
  border-color: var(--tt-accent);
  background: rgba(79, 214, 232, 0.12);
  color: var(--tt-accent);
}
:root:not([data-theme="light"]) #screen-public .tt-logo > .tt-logo-mark {
  background-color: transparent;
  box-shadow: none;
}
/* Бренд в шапке — это <button>, а глобального сброса фона у кнопок в файле
   нет: браузер рисовал свой светло-серый ButtonFace. На кремовой теме это
   сливалось с фоном, на чёрной вылезло плашкой. */
/* ------------------------------------------------------- кнопка темы
   Иконка показывает ДЕЙСТВИЕ: на тёмной теме — солнце («включить день»),
   на светлой — луна. Так понятнее, чем рисовать текущее состояние. */
.tt-theme-btn {
  width: 46px;
  height: 46px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  padding: 0;
  border: 1px solid var(--tt-border);
  border-radius: 13px;
  background: transparent;
  color: var(--tt-text);
  cursor: pointer;
  transition: 0.18s ease;
}
.tt-theme-btn svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  grid-area: 1 / 1;
}
.tt-theme-btn:hover {
  border-color: var(--tt-accent);
  color: var(--tt-accent);
}
.tt-theme-btn:focus-visible {
  outline: 2px solid var(--tt-accent);
  outline-offset: 2px;
}
/* Показываем ровно одну иконку — ту, что описывает переход. Скоуп на
   #theme-toggle (публичная кнопка): иначе правило гасило бы иконку и у
   кнопки кабинета, у неё те же классы, но своя тема (data-app-theme). */
:root[data-theme="dark"] #theme-toggle .tt-theme-moon,
:root[data-theme="light"] #theme-toggle .tt-theme-sun { display: none; }
/* Кнопка кабинета: по умолчанию (кремовая) — луна «включить тёмную»,
   в тёмной — солнце «вернуть светлую». */
:root[data-app-theme="dark"] .tt-app-theme .tt-theme-moon,
:root:not([data-app-theme="dark"]) .tt-app-theme .tt-theme-sun { display: none; }

/* Бренд в шапке — это <button>, а глобального сброса фона у кнопок в файле
   нет: браузер подставляет свои ButtonFace и ButtonText. Сброс нужен в
   ОБЕИХ темах — в светлой под логотипом вылезала такая же плашка, просто
   на кремовом фоне её не замечали, пока шапка не легла на видео. */
#screen-public .tt-public-brand {
  border: 0;
  background: transparent;
  color: var(--tt-text);
}
#screen-public .tt-public-footer { border-top: 1px solid var(--tt-border); }

/* --tt-forest в тёмной теме стал почти чёрным, и всё, что красило им ТЕКСТ,
   пропало на тёмном фоне. В кабинете он остался прежним, поэтому чиним
   только публичные места. */
#screen-public .tt-crumb { color: var(--tt-accent); }
/* У кнопок поднавигации фон задан только для :hover и .is-active, так что
   неактивные показывали серый ButtonFace браузера — та же мина, что у
   бренда. На кремовой теме её не было видно. */
#screen-public .tt-public-subnav button { background: transparent; }
:root:not([data-theme="light"]) #screen-public .tt-public-subnav .tt-about-nav {
  border-color: var(--tt-border);
  color: var(--tt-text);
}
#screen-public .tt-cat-tile-art::after { color: var(--tt-accent); }
/* Активный вариант маршрута был темнее неактивного — выбор не читался. */
:root:not([data-theme="light"]) #screen-public .tt-cat-variant.is-active {
  border-color: var(--tt-accent);
  background: var(--tt-accent-soft);
  color: var(--tt-accent);
}

/* Фон самой страницы: body держит кремовый --tt-bg из :root, и при
   «резиновом» скролле из-под тёмного экрана выглядывала кремовая полоса. */
:root:not([data-theme="light"]) body:has(#screen-public:not([hidden])) {
  background: #070b0d;
}

/* Акценты, которые были золотыми, — в бирюзу. */
:root:not([data-theme="light"]) #screen-public .tt-public-intro .tt-eyebrow,
:root:not([data-theme="light"]) #screen-public .tt-public-intro h1 em,
:root:not([data-theme="light"]) #screen-public .tt-about-copy .tt-eyebrow,
#screen-public .tt-cat-heading .tt-eyebrow { color: var(--tt-accent); }
#screen-public .tt-hero-search-field:focus-within { outline-color: var(--tt-accent); }

/* Герой: зелёная тонировка ролика меняется на тёмно-бирюзовую, иначе
   поверх чёрной страницы он выглядел бы зелёным пятном. */
:root:not([data-theme="light"]) #screen-public .tt-public-intro {
  background: #05090b;
}
:root:not([data-theme="light"]) #screen-public .tt-public-intro::before {

:root:not([data-theme="light"]) #screen-public .tt-hero-search {
  border-color: rgba(122, 200, 214, 0.22);
  background: rgba(9, 18, 22, 0.62);
}
/* Поля стали тёмными: кремовые на чёрной странице били по глазам.
   color-scheme: dark выше заодно перекрашивает выпадающий список. */
:root:not([data-theme="light"]) #screen-public .tt-hero-search-field {
  border: 1px solid rgba(122, 200, 214, 0.16);
  background: rgba(255, 255, 255, 0.05);
}
#screen-public .tt-hero-search-field span { color: var(--tt-text-subtle); }
:root:not([data-theme="light"]) #screen-public .tt-hero-search-field select {

  background-image:

    linear-gradient(135deg, #7fa3ad 50%, transparent 50%);

/* Блоки, которые были тёмно-зелёными, — в тон странице. */
:root:not([data-theme="light"]) #screen-public .tt-about-company {
  border-color: var(--tt-border);
  background: linear-gradient(155deg, #0c181c 0%, #060c0e 100%);
}
:root:not([data-theme="light"]) #screen-public .tt-cat-hero {
  background: linear-gradient(150deg, rgba(14, 40, 47, 0.9), rgba(5, 12, 15, 0.98));
}
#screen-public .tt-cat-hero .tt-muted-note { color: var(--tt-accent); }
:root:not([data-theme="light"]) #screen-public .tt-cat-tile-art {

  background-position: center;
