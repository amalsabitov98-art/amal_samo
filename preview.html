<meta charset="utf-8" />
<title>Turon Tour — кабинет агентства (превью)</title>
<style>
:root {
  --tt-bg: #f7f5f0;
  --tt-surface: #ffffff;
  --tt-border: #e4e0d6;
  --tt-text: #22201b;
  --tt-text-muted: #6b6558;
  --tt-accent: #b5722e;
  --tt-accent-dark: #8f5a24;
  --tt-accent-soft: #f3e6d6;
  --tt-success: #3a7d54;
  --tt-warn-bg: #fdf3e0;
  --tt-warn-border: #e6c48a;
  --tt-warn-text: #7a5312;
  --tt-radius: 14px;
  --tt-shadow: 0 4px 18px rgba(30, 25, 15, 0.08);
  font-synthesis: none;
}

@media (prefers-color-scheme: dark) {
  :root {
    --tt-bg: #17140f;
    --tt-surface: #221e17;
    --tt-border: #34302a;
    --tt-text: #f3efe6;
    --tt-text-muted: #b3ab9a;
    --tt-accent: #d99a52;
    --tt-accent-dark: #eab475;
    --tt-accent-soft: #3a2d1c;
    --tt-success: #6fbf8b;
    --tt-warn-bg: #3a2f19;
    --tt-warn-border: #6d5629;
    --tt-warn-text: #f0d9a8;
    --tt-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme="dark"] {
  --tt-bg: #17140f;
  --tt-surface: #221e17;
  --tt-border: #34302a;
  --tt-text: #f3efe6;
  --tt-text-muted: #b3ab9a;
  --tt-accent: #d99a52;
  --tt-accent-dark: #eab475;
  --tt-accent-soft: #3a2d1c;
  --tt-success: #6fbf8b;
  --tt-warn-bg: #3a2f19;
  --tt-warn-border: #6d5629;
  --tt-warn-text: #f0d9a8;
  --tt-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

:root[data-theme="light"] {
  --tt-bg: #f7f5f0;
  --tt-surface: #ffffff;
  --tt-border: #e4e0d6;
  --tt-text: #22201b;
  --tt-text-muted: #6b6558;
  --tt-accent: #b5722e;
  --tt-accent-dark: #8f5a24;
  --tt-accent-soft: #f3e6d6;
  --tt-success: #3a7d54;
  --tt-warn-bg: #fdf3e0;
  --tt-warn-border: #e6c48a;
  --tt-warn-text: #7a5312;
  --tt-shadow: 0 4px 18px rgba(30, 25, 15, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--tt-bg);
  color: var(--tt-text);
  line-height: 1.45;
}

a { color: inherit; }

.tt-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  background: var(--tt-surface);
  border-bottom: 1px solid var(--tt-border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.tt-logo {
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: 0.02em;
}
.tt-logo span { color: var(--tt-accent); }

.tt-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

.tt-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--tt-border);
}

.tt-tab {
  padding: 10px 18px;
  border: none;
  background: none;
  color: var(--tt-text-muted);
  font-size: 0.95rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tt-tab.is-active {
  color: var(--tt-accent);
  border-bottom-color: var(--tt-accent);
  font-weight: 600;
}

.tt-search-panel {
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 20px;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr auto;
  gap: 14px;
  margin-bottom: 28px;
}

@media (max-width: 720px) {
  .tt-search-panel { grid-template-columns: 1fr; }
}

.tt-field label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 6px;
}

.tt-field input,
.tt-field select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

.tt-btn {
  border: none;
  border-radius: 9px;
  padding: 10px 20px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--tt-accent);
  color: #fff;
  transition: background 0.15s ease;
}
.tt-btn:hover { background: var(--tt-accent-dark); }
.tt-btn.secondary {
  background: transparent;
  color: var(--tt-accent);
  border: 1px solid var(--tt-accent);
}
.tt-btn.secondary:hover { background: var(--tt-accent-soft); }
.tt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.tt-search-panel .tt-btn { align-self: end; }

.tt-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}

.tt-card {
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.tt-card-cover {
  height: 150px;
  background: linear-gradient(135deg, var(--tt-accent-soft), var(--tt-border));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tt-accent-dark);
  font-size: 0.85rem;
}

.tt-card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.tt-card-title { font-size: 1.05rem; font-weight: 700; }
.tt-card-meta { font-size: 0.85rem; color: var(--tt-text-muted); }
.tt-card-desc { font-size: 0.88rem; color: var(--tt-text-muted); flex: 1; }

.tt-badge {
  display: inline-block;
  font-size: 0.72rem;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--tt-accent-soft);
  color: var(--tt-accent-dark);
  width: fit-content;
}

.tt-card-price {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--tt-accent-dark);
}
.tt-card-price small {
  font-weight: 400;
  font-size: 0.75rem;
  color: var(--tt-text-muted);
}

.tt-card-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--tt-border);
}

.tt-empty-state {
  text-align: center;
  color: var(--tt-text-muted);
  padding: 60px 20px;
}


/* ======================= Кабинет агентства ======================= */

.tt-btn-sm { padding: 7px 14px; font-size: 0.85rem; }

.tt-header-right { display: flex; align-items: center; gap: 12px; }
.tt-agency-chip {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--tt-accent-soft);
  color: var(--tt-accent-dark);
}

.tt-muted-note { font-size: 0.8rem; color: var(--tt-text-muted); }

.tt-field-full { margin-bottom: 14px; text-align: left; }
.tt-field-full label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 5px;
}
.tt-field-full input,
.tt-field-full select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

.tt-error-box {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid #d9a49e;
  background: #fbecea;
  color: #8d3229;
  font-size: 0.85rem;
  text-align: left;
}
@media (prefers-color-scheme: dark) {
  .tt-error-box { border-color: #6b3b35; background: #3a211e; color: #f0bdb6; }
}
:root[data-theme="dark"] .tt-error-box {
  border-color: #6b3b35; background: #3a211e; color: #f0bdb6;
}
:root[data-theme="light"] .tt-error-box {
  border-color: #d9a49e; background: #fbecea; color: #8d3229;
}

/* ------------------------------------------------------------- вход */
.tt-login-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.tt-login-card {
  width: 100%;
  max-width: 360px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 32px 28px;
  text-align: center;
}
.tt-login-card .tt-muted-note { margin: 4px 0 22px; }
.tt-login-card .tt-btn { width: 100%; }
.tt-login-card #demo-hint {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--tt-border);
  line-height: 1.7;
}

/* -------------------------------------------------------- фильтры */
.tt-toolbar {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.tt-toolbar .tt-field { min-width: 190px; }
.tt-check-inline {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.88rem;
  color: var(--tt-text-muted);
  padding-bottom: 10px;
  cursor: pointer;
}

/* --------------------------------------------------------- заезды */
.tt-dep {
  display: grid;
  grid-template-columns: 190px 1fr 170px 150px;
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-left: 3px solid var(--tt-success);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
.tt-dep.is-low { border-left-color: var(--tt-warn-border); }
.tt-dep.is-full { border-left-color: var(--tt-border); opacity: 0.62; }

@media (max-width: 860px) {
  .tt-dep { grid-template-columns: 1fr; gap: 12px; }
}

.tt-dep-date strong { font-size: 1.05rem; display: block; }
.tt-dep-code {
  font-size: 0.75rem;
  color: var(--tt-text-muted);
  font-variant-numeric: tabular-nums;
}
.tt-dep-meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.tt-badge-info { background: var(--tt-warn-bg); color: var(--tt-warn-text); }
.tt-badge-off { background: var(--tt-border); color: var(--tt-text-muted); }

.tt-dep-prices { display: flex; flex-wrap: wrap; gap: 6px; }
.tt-price-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--tt-bg);
  border: 1px solid var(--tt-border);
  font-variant-numeric: tabular-nums;
}
.tt-price-chip em {
  font-style: normal;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--tt-text-muted);
  letter-spacing: 0.04em;
}
.tt-child-prices {
  flex-basis: 100%;
  font-size: 0.76rem;
  color: var(--tt-text-muted);
  margin-top: 2px;
}

.tt-seat-bar {
  height: 6px;
  border-radius: 999px;
  background: var(--tt-border);
  overflow: hidden;
  margin-bottom: 6px;
}
.tt-seat-bar i { display: block; height: 100%; background: var(--tt-accent); }
.tt-seat-text { font-size: 0.82rem; color: var(--tt-text-muted); }
.tt-dep-action { text-align: right; }
.tt-dep-action .tt-btn { width: 100%; }

/* ------------------------------------------------------ мои брони */
.tt-booking {
  display: grid;
  grid-template-columns: 1fr 260px 130px;
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
@media (max-width: 780px) {
  .tt-booking { grid-template-columns: 1fr; }
}
.tt-booking.is-cancelled { opacity: 0.55; }
.tt-booking-main { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.tt-booking-action { text-align: right; }

.tt-sum-line {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 0.85rem;
  color: var(--tt-text-muted);
  padding: 2px 0;
  font-variant-numeric: tabular-nums;
}
.tt-sum-line.tt-owed strong { color: var(--tt-warn-text); }
.tt-sum-total {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 1.1rem;
  font-weight: 700;
  padding-top: 8px;
  margin-top: 6px;
  border-top: 1px solid var(--tt-border);
  font-variant-numeric: tabular-nums;
}

/* ----------------------------------------------------- бронирование */
/* hidden не скрывает элемент, которому задан display — явный display
   выигрывает. Ловилось дважды: невидимое окно брони перехватывало клики,
   а экран входа оставался поверх кабинета. Правило общее, чтобы не
   наступить снова при добавлении новых блоков с display. */
[hidden] { display: none !important; }

.tt-modal {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 10, 0.55);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 50;
}
.tt-modal-card {
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}
.tt-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--tt-border);
}
.tt-modal-head h2 { margin: 0 0 2px; font-size: 1.15rem; }
.tt-modal-body { padding: 18px 22px; overflow-y: auto; }
.tt-modal-foot {
  padding: 16px 22px;
  border-top: 1px solid var(--tt-border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.tt-modal-foot > div { flex: 1; min-width: 220px; }

.tt-icon-btn {
  border: none;
  background: none;
  color: var(--tt-text-muted);
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}
.tt-icon-btn:hover { color: var(--tt-text); }

.tt-pax {
  border: 1px solid var(--tt-border);
  border-radius: 11px;
  padding: 14px;
  margin-bottom: 12px;
}
.tt-pax-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.92rem;
}
.tt-pax-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tt-pax-grid .tt-col-2 { grid-column: span 2; }
@media (max-width: 560px) {
  .tt-pax-grid { grid-template-columns: 1fr; }
  .tt-pax-grid .tt-col-2 { grid-column: span 1; }
}
.tt-pax-grid label {
  display: block;
  font-size: 0.74rem;
  color: var(--tt-text-muted);
  margin-bottom: 4px;
}
.tt-pax-grid input,
.tt-pax-grid select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.88rem;
}
.tt-pax-price {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--tt-border);
  font-size: 0.85rem;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
.tt-pax-tariff { color: var(--tt-text-muted); }
.tt-price-warn { color: var(--tt-warn-text); }

/* ------------------------------------------------------ уведомление */
.tt-flash {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  background: var(--tt-text);
  color: var(--tt-bg);
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 0.88rem;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
  z-index: 80;
  transition: opacity 0.5s ease;
}
.tt-flash.is-out { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .tt-flash { transition: none; }
}

/* ------------------------------------------------ комиссии и заработок */
.tt-earn strong, .tt-earn-value { color: var(--tt-success); }
.tt-owed-value { color: var(--tt-warn-text); }

.tt-earnings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 18px 20px;
  margin-bottom: 18px;
}
.tt-earnings > div { display: flex; flex-direction: column; gap: 2px; }
.tt-earnings span { font-size: 0.8rem; color: var(--tt-text-muted); }
.tt-earnings strong { font-size: 1.35rem; font-variant-numeric: tabular-nums; }

.tt-tour {
  display: grid;
  grid-template-columns: 1fr 170px 110px;
  gap: 18px;
  align-items: center;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 16px 18px;
  margin-bottom: 10px;
}
@media (max-width: 700px) {
  .tt-tour { grid-template-columns: 1fr; gap: 10px; }
}
.tt-tour.is-pending { opacity: 0.72; }
.tt-tour-commission { display: flex; flex-direction: column; }
.tt-tour-commission .tt-earn-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ==================== Сторона оператора ==================== */

.tt-ok-box {
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-success);
  background: var(--tt-accent-soft);
  color: var(--tt-success);
  font-size: 0.85rem;
}

.tt-panel {
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
  padding: 20px;
  margin-bottom: 20px;
}
.tt-panel h2 { margin: 0 0 14px; font-size: 1.05rem; }

.tt-new-agency-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr auto;
  gap: 12px;
  align-items: end;
}
@media (max-width: 780px) {
  .tt-new-agency-grid { grid-template-columns: 1fr; }
}
.tt-new-agency-grid label {
  display: block;
  font-size: 0.78rem;
  color: var(--tt-text-muted);
  margin-bottom: 5px;
}
.tt-new-agency-grid input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--tt-border);
  background: var(--tt-bg);
  color: var(--tt-text);
  font-size: 0.95rem;
}

.tt-manifest-meta {
  font-size: 0.88rem;
  color: var(--tt-text-muted);
  margin-bottom: 12px;
}

/* Таблица широкая — прокручиваем её саму, страница вбок не едет */
.tt-table-wrap {
  overflow-x: auto;
  background: var(--tt-surface);
  border: 1px solid var(--tt-border);
  border-radius: var(--tt-radius);
  box-shadow: var(--tt-shadow);
}
.tt-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.84rem;
  white-space: nowrap;
}
.tt-table th,
.tt-table td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--tt-border);
}
.tt-table th {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--tt-text-muted);
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--tt-surface);
}
.tt-table tbody tr:last-child td { border-bottom: none; }
.tt-table tbody tr:hover { background: var(--tt-bg); }
.tt-table td:nth-child(11) { font-variant-numeric: tabular-nums; text-align: right; }


/* — только для превью: полоса-пояснение над реальным интерфейсом — */
.tt-preview-note {
  background: var(--tt-accent-soft);
  border-bottom: 1px solid var(--tt-border);
  color: var(--tt-text);
  padding: 10px 28px;
  font-size: 0.82rem;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: baseline;
}
.tt-preview-note strong { color: var(--tt-accent-dark); }
.tt-preview-note span { color: var(--tt-text-muted); }
/* экран входа занимает всю высоту — в превью вычитаем полосу */
.tt-login-screen { min-height: calc(100vh - 40px); }
</style>

<div class="tt-preview-note">
  <strong>Превью</strong>
  <span>Рабочая сборка на реальных заездах и ценах. Бэкенд не подключён:
        брони сохраняются только в этом браузере.</span>
</div>

<!-- ------------------------------------------------------------- вход -->
<section id="screen-login" class="tt-login-screen">
  <form class="tt-login-card" id="login-form">
    <div class="tt-logo">Turon <span>Tour</span></div>
    <p class="tt-muted-note">Кабинет агентства</p>
    <div class="tt-field-full">
      <label for="l-login">Логин</label>
      <input type="text" id="l-login" autocomplete="username" required />
    </div>
    <div class="tt-field-full">
      <label for="l-password">Пароль</label>
      <input type="password" id="l-password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="tt-btn" id="login-btn">Войти</button>
    <div id="login-error"></div>
    <div id="demo-hint" class="tt-muted-note" hidden></div>
  </form>
</section>

<!-- ------------------------------------------------------------ кабинет -->
<div id="screen-app" hidden>
  <header class="tt-header">
    <div class="tt-logo">Turon <span>Tour</span></div>
    <div class="tt-header-right">
      <span id="agency-name" class="tt-agency-chip"></span>
      <button class="tt-btn secondary tt-btn-sm" id="logout-btn">Выйти</button>
    </div>
  </header>

  <main class="tt-container">
    <div class="tt-tabs">
      <button class="tt-tab tt-tab-ag is-active" data-tab="departures">Заезды</button>
      <button class="tt-tab tt-tab-ag" data-tab="bookings">Мои брони</button>
      <button class="tt-tab tt-tab-ag" data-tab="tours">Туры и комиссии</button>
      <button class="tt-tab tt-tab-op" data-tab="manifest" hidden>Списки пассажиров</button>
      <button class="tt-tab tt-tab-op" data-tab="admin-bookings" hidden>Все брони</button>
      <button class="tt-tab tt-tab-op" data-tab="agencies" hidden>Агентства</button>
    </div>

    <section id="panel-departures">
      <div class="tt-toolbar">
        <div class="tt-field">
          <label for="f-transport">Транспорт</label>
          <select id="f-transport">
            <option value="">Все</option>
            <option value="TZX">Авиа (Трабзон)</option>
            <option value="BUS">Автобус</option>
          </select>
        </div>
        <label class="tt-check-inline">
          <input type="checkbox" id="f-available" checked />
          Только со свободными местами
        </label>
      </div>
      <div id="departures-list"></div>
    </section>

    <section id="panel-bookings" hidden>
      <div id="earnings-summary"></div>
      <div id="bookings-list"></div>
    </section>

    <section id="panel-tours" hidden>
      <div id="tours-list"></div>
    </section>

    <section id="panel-manifest" hidden>
      <div class="tt-toolbar">
        <div class="tt-field" style="min-width:340px">
          <label for="adm-departure">Заезд</label>
          <select id="adm-departure"></select>
        </div>
        <button class="tt-btn" id="adm-export" disabled>Выгрузить CSV</button>
      </div>
      <div id="adm-manifest"></div>
    </section>

    <section id="panel-admin-bookings" hidden>
      <div id="adm-bookings"></div>
    </section>

    <section id="panel-agencies" hidden>
      <form class="tt-panel" id="adm-new-agency">
        <h2>Новое агентство</h2>
        <div class="tt-new-agency-grid">
          <div><label for="na-name">Название</label>
            <input type="text" id="na-name" required /></div>
          <div><label for="na-login">Логин</label>
            <input type="text" id="na-login" autocomplete="off" required /></div>
          <div><label for="na-password">Пароль (от 8 символов)</label>
            <input type="text" id="na-password" autocomplete="new-password" required /></div>
          <button type="submit" class="tt-btn">Завести</button>
        </div>
        <div id="adm-agency-result"></div>
      </form>
      <div id="adm-agencies"></div>
    </section>
  </main>
</div>

<!-- --------------------------------------------------- окно бронирования -->
<div id="booking-modal" class="tt-modal" hidden>
  <div class="tt-modal-card">
    <div class="tt-modal-head">
      <div>
        <h2 id="bm-title">Бронирование</h2>
        <div class="tt-muted-note" id="bm-sub"></div>
      </div>
      <button class="tt-icon-btn" id="bm-close" aria-label="Закрыть">&times;</button>
    </div>
    <div class="tt-modal-body">
      <div id="bm-passengers"></div>
      <button class="tt-btn secondary tt-btn-sm" id="bm-add">+ Добавить пассажира</button>
      <div class="tt-field-full" style="margin-top:16px">
        <label for="bm-note">Примечание для менеджера</label>
        <input type="text" id="bm-note" placeholder="Необязательно" />
      </div>
    </div>
    <div class="tt-modal-foot">
      <div id="bm-summary"></div>
      <button class="tt-btn" id="bm-submit">Забронировать</button>
    </div>
  </div>
</div>

<script>
/*
 * Клиент API кабинета.
 *
 * Если в js/config.js задан apiBaseUrl — работаем с настоящим воркером и
 * базой D1. Если нет — включается демо-режим: те же методы, но данные
 * живут в браузере (localStorage), на реальных заездах и ценах из
 * ведомости. Демо нужен, чтобы показать кабинет без развёрнутого бэкенда;
 * экраны в js/app.js обоих режимов не различают.
 */
(function (global) {
  "use strict";

  var API_BASE = (global.TURON_CONFIG && global.TURON_CONFIG.apiBaseUrl) || "";
  var TOKEN_KEY = "turon_token";
  var DEMO_KEY = "turon_demo_state";

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

  // ------------------------------------------------------------- сеть
  function request(path, options) {
    options = options || {};
    var headers = { "Content-Type": "application/json" };
    if (getToken()) headers.Authorization = "Bearer " + getToken();
    return fetch(API_BASE + path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || "Ошибка запроса (" + r.status + ")");
        return data;
      });
    });
  }

  // ------------------------------------------------------- демо-хранилище
  var DEMO_AGENCIES = [
    { id: 1, login: "umida", name: "UMIDA" },
    { id: 2, login: "easytourism", name: "EASY TOURISM" },
    { id: 3, login: "ofotour", name: "OFO TOUR" },
    { id: 4, login: "operator", name: "Turon Tour (оператор)", role: "operator" },
  ];
  var DEMO_PASSWORD = "turon2026";

  function demoState() {
    var raw = localStorage.getItem(DEMO_KEY);
    if (raw) return JSON.parse(raw);
    var fresh = {
      departures: JSON.parse(JSON.stringify(global.TURON_SEED || [])),
      bookings: [],
      agency: null,
    };
    localStorage.setItem(DEMO_KEY, JSON.stringify(fresh));
    return fresh;
  }

  function saveDemo(s) { localStorage.setItem(DEMO_KEY, JSON.stringify(s)); }

  function ageOn(birthDate, onDate) {
    var b = new Date(birthDate), o = new Date(onDate);
    var age = o.getFullYear() - b.getFullYear();
    var m = o.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && o.getDate() < b.getDate())) age--;
    return age;
  }

  // Те же правила, что в worker/index.js: детский тариф по возрасту на
  // дату выезда, при пересечении диапазонов — самый узкий.
  function priceFor(passenger, departure) {
    var age = ageOn(passenger.birth_date, departure.date_start);
    var child = departure.prices
      .filter(function (p) { return p.kind === "child" && age >= p.age_from && age < p.age_to; })
      .sort(function (a, b) { return (a.age_to - a.age_from) - (b.age_to - b.age_from); })[0];
    if (child) {
      return { code: child.code, label: child.label, price: child.price, occupies_seat: child.occupies_seat };
    }
    var pl = departure.prices.find(function (p) {
      return p.kind === "placement" && p.code === passenger.placement;
    });
    if (!pl) return null;
    return { code: pl.code, label: pl.label, price: pl.price, occupies_seat: 1 };
  }

/*
   * Проверка паспорта. Большинство стран, включая Турцию и Японию, требуют
   * запас в 6 месяцев после окончания поездки, поэтому предупреждаем не
   * только об уже истёкшем документе.
   *
   * Это предупреждение, а не запрет: правило зависит от направления, и
   * решать должен менеджер, а не форма.
   */
  function passportIssue(expiry, departureDate) {
    if (!expiry) return null;
    const exp = new Date(expiry), dep = new Date(departureDate);
    if (isNaN(exp.getTime())) return null;
    if (exp <= dep) return "паспорт истекает до поездки";
    const sixMonths = new Date(dep);
    sixMonths.setMonth(sixMonths.getMonth() + 6);
    if (exp < sixMonths) return "до конца действия паспорта меньше 6 месяцев после поездки";
    return null;
  }

  function demoLogin(login, password) {
    var agency = DEMO_AGENCIES.filter(function (a) {
      return a.login === String(login).trim().toLowerCase();
    })[0];
    if (!agency || password !== DEMO_PASSWORD) {
      return Promise.reject(new Error("Неверный логин или пароль"));
    }
    agency = Object.assign({ role: "agency" }, agency);
    var s = demoState(); s.agency = agency; saveDemo(s);
    setToken("demo-" + agency.id);
    return Promise.resolve({ token: "demo-" + agency.id, agency: agency });
  }

  function demoCreateBooking(payload) {
    var s = demoState();
    var d = s.departures.filter(function (x) { return x.code === payload.departure_code; })[0];
    if (!d) return Promise.reject(new Error("Заезд не найден"));

    var priced = [], seats = 0, total = 0;
    for (var i = 0; i < payload.passengers.length; i++) {
      var p = payload.passengers[i];
      var t = priceFor(p, d);
      if (!t) {
        return Promise.reject(new Error(
          "Для заезда " + d.code + " нет цены на размещение " + p.placement));
      }
      priced.push({
        full_name: p.full_name, birth_date: p.birth_date,
        passport_number: p.passport_number, passport_expiry: p.passport_expiry || "",
        placement: p.placement, price_code: t.code, tariff: t.label,
        price: t.price, occupies_seat: t.occupies_seat,
      });
      if (t.occupies_seat) seats++;
      total += t.price;
    }
    if (d.seats_taken + seats > d.capacity) {
      return Promise.reject(new Error(
        "Не хватает мест: нужно " + seats + ", свободно " + (d.capacity - d.seats_taken)));
    }
    // Комиссия — за проданного туриста; младенец на руках продажей не считается.
    var commission = (d.agency_commission || 0) * seats;
    d.seats_taken += seats;
    var n = s.bookings.filter(function (b) { return b.departure_code === d.code; }).length + 1;
    var booking = {
      id: s.bookings.length + 1,
      code: d.code + "-" + String(n).padStart(2, "0"),
      agency_id: s.agency.id,
      departure_code: d.code,
      date_start: d.date_start,
      transport: d.transport,
      status: "confirmed",
      passengers_count: payload.passengers.length,
      seats_used: seats,
      total_price: total,
      agency_commission: commission,
      paid: 0,
      payments: [],
      note: payload.note || null,
      created_at: new Date().toISOString(),
      passengers: priced,
    };
    s.bookings.push(booking); saveDemo(s);
    return Promise.resolve({
      booking_code: booking.code, departure_code: d.code,
      seats_taken: seats, total_price: total,
      agency_commission: commission, passengers: priced,
    });
  }

  // --------------------------------------------------------------- API
  var Api = {
    isDemo: function () { return !API_BASE; },
    demoPassword: DEMO_PASSWORD,
    demoLogins: DEMO_AGENCIES.map(function (a) { return a.login; }),
    isLoggedIn: function () { return !!getToken(); },

    login: function (login, password) {
      if (!API_BASE) return demoLogin(login, password);
      return request("/api/login", { method: "POST", body: { login: login, password: password } })
        .then(function (res) { setToken(res.token); return res; });
    },

    logout: function () {
      if (!API_BASE) { setToken(""); return Promise.resolve(); }
      return request("/api/logout", { method: "POST" })
        .catch(function () {})
        .then(function () { setToken(""); });
    },

    me: function () {
      if (!API_BASE) {
        var s = demoState();
        return s.agency ? Promise.resolve({ agency: s.agency })
                        : Promise.reject(new Error("Требуется вход"));
      }
      return request("/api/me");
    },

    tours: function () {
      if (!API_BASE) return Promise.resolve((global.TURON_TOURS || []).slice());
      return request("/api/tours");
    },

    departures: function () {
      if (!API_BASE) {
        return Promise.resolve(demoState().departures.map(function (d) {
          return Object.assign({}, d, { seats_free: d.capacity - d.seats_taken });
        }));
      }
      return request("/api/departures");
    },

    createBooking: function (payload) {
      if (!API_BASE) return demoCreateBooking(payload);
      return request("/api/bookings", { method: "POST", body: payload });
    },

    bookings: function () {
      if (!API_BASE) {
        var s = demoState();
        return Promise.resolve(s.bookings
          .filter(function (b) { return s.agency && b.agency_id === s.agency.id; })
          .map(function (b) { return Object.assign({}, b, { balance: b.total_price - b.paid }); })
          .reverse());
      }
      return request("/api/bookings");
    },

    cancelBooking: function (id) {
      if (!API_BASE) {
        var s = demoState();
        var b = s.bookings.filter(function (x) { return x.id === id; })[0];
        if (!b || b.status !== "confirmed") return Promise.reject(new Error("Бронь не найдена"));
        b.status = "cancelled";
        var d = s.departures.filter(function (x) { return x.code === b.departure_code; })[0];
        if (d) d.seats_taken -= b.seats_used;
        saveDemo(s);
        return Promise.resolve({ booking_code: b.code, released_seats: b.seats_used });
      }
      return request("/api/bookings/" + id + "/cancel", { method: "POST" });
    },


    // ------------------------------------------------ сторона оператора
    adminBookings: function (departureCode) {
      if (!API_BASE) {
        var s = demoState();
        var byCode = {};
        DEMO_AGENCIES.forEach(function (a) { byCode[a.id] = a.name; });
        return Promise.resolve(s.bookings
          .filter(function (b) { return !departureCode || b.departure_code === departureCode; })
          .map(function (b) {
            return Object.assign({}, b, {
              agency_name: byCode[b.agency_id] || "—",
              balance: b.total_price - b.paid,
            });
          }).reverse());
      }
      return request("/api/admin/bookings" +
        (departureCode ? "?departure=" + encodeURIComponent(departureCode) : ""));
    },

    manifest: function (departureCode) {
      if (!API_BASE) {
        var s = demoState();
        var d = s.departures.filter(function (x) { return x.code === departureCode; })[0];
        if (!d) return Promise.reject(new Error("Заезд не найден"));
        var byId = {};
        DEMO_AGENCIES.forEach(function (a) { byId[a.id] = a; });
        var rows = [];
        s.bookings.filter(function (b) {
          return b.departure_code === departureCode && b.status === "confirmed";
        }).forEach(function (b) {
          (b.passengers || []).forEach(function (p) {
            rows.push(Object.assign({}, p, {
              booking_code: b.code, booked_at: b.created_at, note: b.note,
              agency_name: (byId[b.agency_id] || {}).name || "—",
              channel: "B2B", total_price: b.total_price, booking_paid: b.paid,
            }));
          });
        });
        return Promise.resolve({ departure: d, passengers: rows });
      }
      return request("/api/admin/manifest?departure=" + encodeURIComponent(departureCode));
    },

    addPayment: function (bookingCode, amount, note) {
      if (!API_BASE) {
        var s = demoState();
        var b = s.bookings.filter(function (x) { return x.code === bookingCode; })[0];
        if (!b || b.status !== "confirmed") {
          return Promise.reject(new Error("Бронь не найдена или отменена"));
        }
        if (b.paid + amount < 0) {
          return Promise.reject(new Error("Возврат больше оплаченного: оплачено " + b.paid));
        }
        b.paid += amount;
        (b.payments = b.payments || []).push({ amount: amount, note: note || null });
        saveDemo(s);
        return Promise.resolve({
          booking_code: bookingCode, paid: b.paid, balance: b.total_price - b.paid,
        });
      }
      return request("/api/admin/payments", {
        method: "POST", body: { booking_code: bookingCode, amount: amount, note: note },
      });
    },

    agencies: function () {
      if (!API_BASE) {
        var s = demoState();
        return Promise.resolve(DEMO_AGENCIES
          .filter(function (a) { return a.role !== "operator"; })
          .map(function (a) {
            return Object.assign({ is_active: 1 }, a, {
              bookings_count: s.bookings.filter(function (b) {
                return b.agency_id === a.id && b.status === "confirmed";
              }).length,
            });
          }));
      }
      return request("/api/admin/agencies");
    },

    createAgency: function (login, name, password) {
      if (!API_BASE) {
        return Promise.reject(new Error(
          "В демо-режиме агентства не заводятся — нужен подключённый бэкенд"));
      }
      return request("/api/admin/agencies", {
        method: "POST", body: { login: login, name: name, password: password },
      });
    },

    priceFor: priceFor,
    passportIssue: passportIssue,
    ageOn: ageOn,
  };

  global.TuronApi = Api;
})(window);

</script>
<script>
/*
 * Экраны туроператора. Подключается всегда, но включается только для
 * учётной записи с ролью operator — агентство этих вкладок не видит,
 * и сервер всё равно отдаст 403 на /api/admin/*.
 *
 * Главное здесь — выгрузка списка пассажиров заезда: колонки повторяют
 * исходную ведомость, чтобы её можно было перестать вести руками.
 */
(function (global) {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var state = { departures: [], current: null };

  var TRANSPORT = { TZX: "Авиа · Трабзон", BUS: "Автобус" };

  function money(v) {
    var whole = Math.abs(v - Math.round(v)) < 0.005;
    return "$" + v.toLocaleString("ru-RU", {
      minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2,
    });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  // ------------------------------------------------------------- выгрузка
  // Колонки и их порядок — как в ведомости, включая узбекские заголовки:
  // менеджер открывает файл и видит привычную таблицу.
  var MANIFEST_COLUMNS = [
    ["ID", function (p) { return p.booking_code; }],
    ["бронь санаси", function (p) { return formatDate(p.booked_at); }],
    ["Ф.И.О.", function (p) { return p.full_name; }],
    ["туғилган санаси", function (p) { return formatDate(p.birth_date); }],
    ["паспорт рақами", function (p) { return p.passport_number; }],
    ["тугаш санаси", function (p) { return formatDate(p.passport_expiry); }],
    ["жойлашув", function (p) { return p.placement; }],
    ["B2B/B2C", function (p) { return p.channel || "B2B"; }],
    ["номланиши", function (p) { return p.agency_name; }],
    ["тариф", function (p) { return p.price_code; }],
    ["нарх USD", function (p) { return p.price; }],
    ["изоҳ", function (p) { return p.note || ""; }],
  ];

  function toCsv(passengers) {
    var cell = function (v) {
      var s = String(v == null ? "" : v);
      return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var lines = [MANIFEST_COLUMNS.map(function (c) { return cell(c[0]); }).join(";")];
    passengers.forEach(function (p) {
      lines.push(MANIFEST_COLUMNS.map(function (c) { return cell(c[1](p)); }).join(";"));
    });
    // BOM обязателен: без него Excel открывает кириллицу кракозябрами,
    // а разделитель «;» — чтобы не спорить с локальными настройками.
    return "﻿" + lines.join("\r\n");
  }

  function downloadCsv(departureCode, passengers) {
    var blob = new Blob([toCsv(passengers)], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "turon-" + departureCode + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // --------------------------------------------------------------- заезды
  function renderDeparturePicker() {
    $("adm-departure").innerHTML = state.departures.map(function (d) {
      return '<option value="' + esc(d.code) + '">' +
        formatDate(d.date_start) + " · " + (TRANSPORT[d.transport] || d.transport) +
        " · " + esc(d.code) + " (занято " + d.seats_taken + "/" + d.capacity + ")</option>";
    }).join("");
  }

  function renderManifest(data) {
    state.current = data;
    var pax = data.passengers;
    if (!pax.length) {
      $("adm-manifest").innerHTML =
        '<div class="tt-empty-state">На этот заезд ещё нет броней через кабинет.' +
        '<div class="tt-muted-note">Места, проданные до запуска системы, ' +
        "учтены в счётчике заезда, но пофамильно их здесь нет.</div></div>";
      $("adm-export").disabled = true;
      return;
    }
    $("adm-export").disabled = false;

    var head = MANIFEST_COLUMNS.map(function (c) { return "<th>" + esc(c[0]) + "</th>"; }).join("");
    var body = pax.map(function (p) {
      return "<tr>" + MANIFEST_COLUMNS.map(function (c) {
        return "<td>" + esc(c[1](p)) + "</td>";
      }).join("") + "</tr>";
    }).join("");

    var seats = pax.filter(function (p) { return p.occupies_seat; }).length;
    $("adm-manifest").innerHTML =
      '<div class="tt-manifest-meta">Пассажиров: <strong>' + pax.length +
        "</strong> · занимают мест: <strong>" + seats + "</strong></div>" +
      '<div class="tt-table-wrap"><table class="tt-table"><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function loadManifest() {
    var code = $("adm-departure").value;
    if (!code) return;
    $("adm-manifest").innerHTML = '<div class="tt-empty-state">Загрузка…</div>';
    TuronApi.manifest(code).then(renderManifest).catch(function (err) {
      $("adm-manifest").innerHTML =
        '<div class="tt-empty-state">Не удалось загрузить список.<div class="tt-muted-note">' +
        esc(err.message) + "</div></div>";
    });
  }

  // ---------------------------------------------------------------- брони
  function renderAdminBookings(list) {
    if (!list.length) {
      $("adm-bookings").innerHTML = '<div class="tt-empty-state">Броней пока нет.</div>';
      return;
    }
    $("adm-bookings").innerHTML = list.map(function (b) {
      var cancelled = b.status === "cancelled";
      return (
        '<article class="tt-booking' + (cancelled ? " is-cancelled" : "") + '">' +
          "<div>" +
            "<strong>" + esc(b.code) + "</strong>" +
            '<div class="tt-muted-note">' + esc(b.agency_name) + " · " +
              formatDate(b.date_start) + " · " + b.passengers_count + " чел." +
              (cancelled ? " · отменена" : "") + "</div>" +
          "</div>" +
          '<div class="tt-booking-money">' +
            '<div class="tt-sum-line"><span>Стоимость</span><strong>' + money(b.total_price) + "</strong></div>" +
            '<div class="tt-sum-line"><span>Оплачено</span><strong>' + money(b.paid) + "</strong></div>" +
            '<div class="tt-sum-line' + (b.balance > 0 ? " tt-owed" : "") +
              '"><span>Остаток</span><strong>' + money(b.balance) + "</strong></div>" +
          "</div>" +
          '<div class="tt-booking-action">' +
            (cancelled ? "" :
              '<button class="tt-btn tt-btn-sm" data-pay="' + esc(b.code) +
              '" data-balance="' + b.balance + '">Внести оплату</button>') +
          "</div>" +
        "</article>"
      );
    }).join("");
  }

  function loadAdminBookings() {
    return TuronApi.adminBookings().then(renderAdminBookings).catch(function (err) {
      $("adm-bookings").innerHTML =
        '<div class="tt-empty-state">Не удалось загрузить брони.<div class="tt-muted-note">' +
        esc(err.message) + "</div></div>";
    });
  }

  // ------------------------------------------------------------- агентства
  function loadAgencies() {
    return TuronApi.agencies().then(function (list) {
      $("adm-agencies").innerHTML = list.map(function (a) {
        return (
          '<article class="tt-tour">' +
            "<div><strong>" + esc(a.name) + "</strong>" +
              '<div class="tt-muted-note">логин: ' + esc(a.login) + "</div></div>" +
            "<div>" + a.bookings_count + " броней</div>" +
            "<div>" + (a.is_active
              ? '<span class="tt-badge">Активно</span>'
              : '<span class="tt-badge tt-badge-off">Отключено</span>') + "</div>" +
          "</article>"
        );
      }).join("");
    }).catch(function (err) {
      $("adm-agencies").innerHTML =
        '<div class="tt-empty-state">Не удалось загрузить агентства.<div class="tt-muted-note">' +
        esc(err.message) + "</div></div>";
    });
  }

  // ------------------------------------------------------------------ вход
  function bind() {
    $("adm-departure").addEventListener("change", loadManifest);
    $("adm-export").addEventListener("click", function () {
      if (state.current) downloadCsv(state.current.departure.code, state.current.passengers);
    });

    $("adm-bookings").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-pay]");
      if (!btn) return;
      var code = btn.dataset.pay;
      var suggested = Number(btn.dataset.balance) || 0;
      var raw = prompt("Сумма оплаты по брони " + code +
        " (остаток " + money(suggested) + "). Отрицательная сумма — возврат:", suggested);
      if (raw === null) return;
      var amount = Number(String(raw).replace(",", "."));
      if (!isFinite(amount) || amount === 0) {
        alert("Введите сумму числом, не равную нулю.");
        return;
      }
      btn.disabled = true;
      TuronApi.addPayment(code, amount).then(function (res) {
        Admin.reload();
        alert("Оплата проведена. По брони " + res.booking_code +
              " оплачено " + money(res.paid) + ", остаток " + money(res.balance) + ".");
      }).catch(function (err) {
        btn.disabled = false;
        alert(err.message);
      });
    });

    $("adm-new-agency").addEventListener("submit", function (e) {
      e.preventDefault();
      var box = $("adm-agency-result");
      TuronApi.createAgency($("na-login").value.trim(), $("na-name").value.trim(),
                            $("na-password").value)
        .then(function (res) {
          box.innerHTML = '<div class="tt-ok-box">Агентство «' + esc(res.name) +
            '» заведено, логин ' + esc(res.login) + "</div>";
          e.target.reset();
          loadAgencies();
        })
        .catch(function (err) {
          box.innerHTML = '<div class="tt-error-box">' + esc(err.message) + "</div>";
        });
    });
  }

  var Admin = {
    isOperator: function (agency) { return agency && agency.role === "operator"; },

    start: function () {
      document.body.classList.add("is-operator");
      bind();
      return TuronApi.departures().then(function (list) {
        // у оператора в выборе — все заезды, включая заполненные
        state.departures = list.slice().reverse();
        renderDeparturePicker();
        loadManifest();
        loadAdminBookings();
        loadAgencies();
      });
    },

    reload: function () {
      loadManifest();
      loadAdminBookings();
    },
  };

  global.TuronAdmin = Admin;
})(window);

</script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var state = { departures: [], current: null, passengers: [] };

  var TRANSPORT = { TZX: "Авиа · Трабзон", BUS: "Автобус" };

  function money(v) {
    var whole = Math.abs(v - Math.round(v)) < 0.005;
    return "$" + v.toLocaleString("ru-RU", {
      minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2,
    });
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString("ru-RU", { day: "2-digit", month: "long" });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ------------------------------------------------------------------ вход
  function showLogin() {
    $("screen-login").hidden = false;
    $("screen-app").hidden = true;
  }

  function showApp(agency) {
    $("screen-login").hidden = true;
    $("screen-app").hidden = false;
    $("agency-name").textContent = agency.name;

    // Оператору показываем его вкладки и прячем агентские: он не бронирует
    // и своих комиссий не имеет.
    var isOperator = TuronAdmin.isOperator(agency);
    document.querySelectorAll(".tt-tab-op").forEach(function (t) { t.hidden = !isOperator; });
    document.querySelectorAll(".tt-tab-ag").forEach(function (t) { t.hidden = isOperator; });
    if (isOperator) {
      TuronAdmin.start();
      switchTab("manifest");
      return;
    }
    switchTab("departures");
    loadDepartures();
    loadBookings();
    loadTours();
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("login-btn");
    btn.disabled = true;
    $("login-error").innerHTML = "";
    TuronApi.login($("l-login").value, $("l-password").value)
      .then(function (res) { showApp(res.agency); })
      .catch(function (err) {
        $("login-error").innerHTML = '<div class="tt-error-box">' + esc(err.message) + "</div>";
      })
      .then(function () { btn.disabled = false; });
  });

  $("logout-btn").addEventListener("click", function () {
    TuronApi.logout().then(function () {
      $("l-password").value = "";
      showLogin();
    });
  });

  // --------------------------------------------------------------- заезды
  function departureCardHtml(d) {
    var placements = d.prices.filter(function (p) { return p.kind === "placement"; })
      .sort(function (a, b) { return a.price - b.price; });
    var children = d.prices.filter(function (p) { return p.kind === "child"; })
      .sort(function (a, b) { return b.price - a.price; });

    var free = d.seats_free;
    var pct = d.capacity ? Math.round((d.seats_taken / d.capacity) * 100) : 0;
    var level = free === 0 ? "is-full" : free <= 10 ? "is-low" : "";

    return (
      '<article class="tt-dep ' + level + '">' +
        '<div class="tt-dep-main">' +
          '<div class="tt-dep-date">' +
            "<strong>" + formatDate(d.date_start) + "</strong>" +
            '<span class="tt-dep-code">' + esc(d.code) + "</span>" +
          "</div>" +
          '<div class="tt-dep-meta">' +
            '<span class="tt-badge">' + (TRANSPORT[d.transport] || d.transport) + "</span>" +
            (d.is_info_tour ? '<span class="tt-badge tt-badge-info">Инфотур</span>' : "") +
          "</div>" +
        "</div>" +

        '<div class="tt-dep-prices">' +
          placements.map(function (p) {
            return '<span class="tt-price-chip"><em>' + esc(p.code) + "</em>" + money(p.price) + "</span>";
          }).join("") +
          (children.length
            ? '<div class="tt-child-prices">' + children.map(function (c) {
                return esc(c.label) + " — " + money(c.price);
              }).join(" · ") + "</div>"
            : "") +
        "</div>" +

        '<div class="tt-dep-seats">' +
          '<div class="tt-seat-bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="tt-seat-text">' +
            (free === 0 ? "мест нет" : "свободно <strong>" + free + "</strong> из " + d.capacity) +
          "</div>" +
        "</div>" +

        '<div class="tt-dep-action">' +
          '<button class="tt-btn" data-book="' + esc(d.code) + '"' +
            (free === 0 ? " disabled" : "") + ">Забронировать</button>" +
        "</div>" +
      "</article>"
    );
  }

  function renderDepartures() {
    var transport = $("f-transport").value;
    var onlyFree = $("f-available").checked;
    var list = state.departures.filter(function (d) {
      if (transport && d.transport !== transport) return false;
      if (onlyFree && d.seats_free <= 0) return false;
      return true;
    });
    $("departures-list").innerHTML = list.length
      ? list.map(departureCardHtml).join("")
      : '<div class="tt-empty-state">Нет заездов по выбранным условиям.</div>';
  }

  function loadDepartures() {
    return TuronApi.departures().then(function (list) {
      state.departures = list;
      renderDepartures();
    }).catch(function (err) {
      $("departures-list").innerHTML =
        '<div class="tt-empty-state">Не удалось загрузить заезды.<div class="tt-muted-note">' +
        esc(err.message) + "</div></div>";
    });
  }

  $("f-transport").addEventListener("change", renderDepartures);
  $("f-available").addEventListener("change", renderDepartures);

  // --------------------------------------------------------- бронирование
  function passengerRowHtml(i, placements) {
    return (
      '<div class="tt-pax" data-pax="' + i + '">' +
        '<div class="tt-pax-head"><strong>Пассажир ' + (i + 1) + "</strong>" +
          (i > 0 ? '<button class="tt-icon-btn" data-remove="' + i + '" aria-label="Убрать">&times;</button>' : "") +
        "</div>" +
        '<div class="tt-pax-grid">' +
          '<div class="tt-col-2"><label>ФИО латиницей, как в паспорте</label>' +
            '<input type="text" data-f="full_name" placeholder="IVANOV IVAN" /></div>' +
          "<div><label>Дата рождения</label><input type=\"date\" data-f=\"birth_date\" /></div>" +
          '<div><label>Размещение</label><select data-f="placement">' +
            placements.map(function (p) {
              return '<option value="' + esc(p.code) + '">' + esc(p.label) + "</option>";
            }).join("") +
          "</select></div>" +
          '<div><label>Номер паспорта</label><input type="text" data-f="passport_number" /></div>' +
          '<div><label>Действителен до</label><input type="date" data-f="passport_expiry" /></div>' +
        "</div>" +
        '<div class="tt-pax-price" data-price></div>' +
      "</div>"
    );
  }

  function collectPassengers() {
    return [].map.call(document.querySelectorAll("#bm-passengers .tt-pax"), function (card) {
      var p = {};
      card.querySelectorAll("[data-f]").forEach(function (input) {
        p[input.dataset.f] = input.value.trim();
      });
      return p;
    });
  }

  // Живой расчёт: те же правила, что применит сервер при сохранении.
  function updateSummary() {
    var d = state.current;
    var rows = collectPassengers();
    var total = 0, seats = 0, ready = rows.length > 0;

    rows.forEach(function (p, i) {
      var box = document.querySelector('[data-pax="' + i + '"] [data-price]');
      if (!p.full_name || !p.birth_date || !p.passport_number) {
        ready = false;
        box.innerHTML = '<span class="tt-muted-note">заполните ФИО, дату рождения и паспорт</span>';
        return;
      }
      var t = TuronApi.priceFor(p, d);
      if (!t) {
        ready = false;
        box.innerHTML = '<span class="tt-price-warn">нет цены на «' + esc(p.placement) + '» для этого заезда</span>';
        return;
      }
      total += t.price;
      if (t.occupies_seat) seats++;
      var age = TuronApi.ageOn(p.birth_date, d.date_start);

      // Ребёнку достался взрослый тариф — обычно значит, что для этого
      // заезда детские цены в прайсе не заданы (так в ведомости у инфотура).
      // Не блокируем, но и молча по взрослой цене не проводим.
      var childByAge = age < 12;
      var gotAdultTariff = d.prices.some(function (pr) {
        return pr.kind === "placement" && pr.code === t.code;
      });
      var needsCheck = childByAge && gotAdultTariff;

      var passport = TuronApi.passportIssue(p.passport_expiry, d.date_start);

      box.innerHTML = '<span class="tt-pax-tariff">' + age + " лет · " + esc(t.label) + "</span>" +
        "<strong>" + money(t.price) + "</strong>" +
        (t.occupies_seat ? "" : '<span class="tt-muted-note"> · без места</span>') +
        (needsCheck
          ? '<span class="tt-price-warn"> · детский тариф на этот заезд не задан, ' +
            "посчитано по взрослому — менеджер уточнит</span>"
          : "") +
        (passport ? '<span class="tt-price-warn"> · ' + esc(passport) + "</span>" : "");
    });

    var overflow = seats > d.seats_free;
    if (overflow) ready = false;

    var commission = (d.agency_commission || 0) * seats;
    $("bm-summary").innerHTML =
      '<div class="tt-sum-line"><span>Пассажиров</span><strong>' + rows.length + "</strong></div>" +
      '<div class="tt-sum-line"><span>Занимают мест</span><strong>' + seats + " из " + d.seats_free + " свободных</strong></div>" +
      (commission > 0
        ? '<div class="tt-sum-line tt-earn"><span>Ваша комиссия</span><strong>' +
          money(commission) + "</strong></div>"
        : "") +
      '<div class="tt-sum-total"><span>Итого к оплате</span><strong>' + money(total) + "</strong></div>" +
      (overflow ? '<div class="tt-error-box">Мест не хватает — уберите пассажиров или выберите другой заезд.</div>' : "");

    $("bm-submit").disabled = !ready;
  }

  function renderPassengers() {
    var placements = state.current.prices.filter(function (p) { return p.kind === "placement"; });
    var saved = collectPassengers();
    $("bm-passengers").innerHTML = state.passengers
      .map(function (_, i) { return passengerRowHtml(i, placements); }).join("");
    saved.forEach(function (p, i) {
      var card = document.querySelector('[data-pax="' + i + '"]');
      if (!card) return;
      Object.keys(p).forEach(function (f) {
        var input = card.querySelector('[data-f="' + f + '"]');
        if (input && p[f]) input.value = p[f];
      });
    });
    updateSummary();
  }

  function openBooking(code) {
    var d = state.departures.filter(function (x) { return x.code === code; })[0];
    if (!d) return;
    state.current = d;
    state.passengers = [{}];
    $("bm-title").textContent = "Заезд " + formatDate(d.date_start);
    $("bm-sub").textContent = (TRANSPORT[d.transport] || d.transport) + " · " + d.code +
      " · свободно " + d.seats_free;
    $("bm-note").value = "";
    $("booking-modal").hidden = false;
    renderPassengers();
  }

  function closeBooking() {
    $("booking-modal").hidden = true;
    state.current = null;
  }

  $("departures-list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-book]");
    if (btn) openBooking(btn.dataset.book);
  });

  $("bm-close").addEventListener("click", closeBooking);
  $("booking-modal").addEventListener("click", function (e) {
    if (e.target === $("booking-modal")) closeBooking();
  });

  $("bm-add").addEventListener("click", function () {
    state.passengers.push({});
    renderPassengers();
  });

  $("bm-passengers").addEventListener("click", function (e) {
    var rm = e.target.closest("[data-remove]");
    if (!rm) return;
    var rows = collectPassengers();
    rows.splice(Number(rm.dataset.remove), 1);
    state.passengers = rows;
    $("bm-passengers").innerHTML = "";
    renderPassengers();
    rows.forEach(function (p, i) {
      var card = document.querySelector('[data-pax="' + i + '"]');
      Object.keys(p).forEach(function (f) {
        var input = card && card.querySelector('[data-f="' + f + '"]');
        if (input && p[f]) input.value = p[f];
      });
    });
    updateSummary();
  });

  $("bm-passengers").addEventListener("input", updateSummary);
  $("bm-passengers").addEventListener("change", updateSummary);

  $("bm-submit").addEventListener("click", function () {
    var btn = $("bm-submit");
    btn.disabled = true;
    TuronApi.createBooking({
      departure_code: state.current.code,
      passengers: collectPassengers(),
      note: $("bm-note").value.trim() || null,
    }).then(function (res) {
      closeBooking();
      return Promise.all([loadDepartures(), loadBookings()]).then(function () {
        switchTab("bookings");
        flash("Бронь " + res.booking_code + " создана на " + money(res.total_price) +
              ", занято мест: " + res.seats_taken);
      });
    }).catch(function (err) {
      $("bm-summary").innerHTML += '<div class="tt-error-box">' + esc(err.message) + "</div>";
      btn.disabled = false;
    });
  });

  // ------------------------------------------------------------ мои брони
  function bookingRowHtml(b) {
    var cancelled = b.status === "cancelled";
    var paidPart = b.paid > 0 && b.balance > 0;
    return (
      '<article class="tt-booking' + (cancelled ? " is-cancelled" : "") + '">' +
        '<div class="tt-booking-main">' +
          '<div><strong>' + esc(b.code) + "</strong>" +
            '<div class="tt-muted-note">' + formatDate(b.date_start) + " · " +
              (TRANSPORT[b.transport] || b.transport) + " · " + b.passengers_count + " чел.</div>" +
          "</div>" +
          (cancelled ? '<span class="tt-badge tt-badge-off">Отменена</span>' : "") +
        "</div>" +
        '<div class="tt-booking-money">' +
          '<div class="tt-sum-line"><span>Стоимость</span><strong>' + money(b.total_price) + "</strong></div>" +
          '<div class="tt-sum-line"><span>Оплачено</span><strong>' + money(b.paid) + "</strong></div>" +
          '<div class="tt-sum-line' + (b.balance > 0 ? " tt-owed" : "") + '"><span>Остаток</span><strong>' +
            money(b.balance) + "</strong></div>" +
          (b.agency_commission > 0
            ? '<div class="tt-sum-line tt-earn"><span>Комиссия</span><strong>' +
              money(b.agency_commission) + "</strong></div>"
            : "") +
          (paidPart ? '<div class="tt-muted-note">частичная оплата</div>' : "") +
        "</div>" +
        '<div class="tt-booking-action">' +
          (cancelled ? "" : '<button class="tt-btn secondary tt-btn-sm" data-cancel="' + b.id + '">Отменить</button>') +
        "</div>" +
      "</article>"
    );
  }

  function loadBookings() {
    return TuronApi.bookings().then(function (list) {
      var active = list.filter(function (b) { return b.status !== "cancelled"; });
      var earned = active.reduce(function (s, b) { return s + (b.agency_commission || 0); }, 0);
      var owed = active.reduce(function (s, b) { return s + (b.balance || 0); }, 0);
      $("earnings-summary").innerHTML = active.length
        ? '<div class="tt-earnings">' +
            '<div><span>Активных броней</span><strong>' + active.length + "</strong></div>" +
            '<div><span>Заработано комиссии</span><strong class="tt-earn-value">' + money(earned) + "</strong></div>" +
            '<div><span>К доплате оператору</span><strong' + (owed > 0 ? ' class="tt-owed-value"' : "") + ">" +
              money(owed) + "</strong></div>" +
          "</div>"
        : "";
      $("bookings-list").innerHTML = list.length
        ? list.map(bookingRowHtml).join("")
        : '<div class="tt-empty-state">Броней пока нет. Выберите заезд на вкладке «Заезды».</div>';
    }).catch(function (err) {
      $("bookings-list").innerHTML =
        '<div class="tt-empty-state">Не удалось загрузить брони.<div class="tt-muted-note">' +
        esc(err.message) + "</div></div>";
    });
  }

  $("bookings-list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-cancel]");
    if (!btn) return;
    if (!confirm("Отменить бронь? Места вернутся в продажу.")) return;
    btn.disabled = true;
    TuronApi.cancelBooking(Number(btn.dataset.cancel)).then(function (res) {
      flash("Бронь " + res.booking_code + " отменена, освобождено мест: " + res.released_seats);
      return Promise.all([loadDepartures(), loadBookings()]);
    }).catch(function (err) {
      alert(err.message);
      btn.disabled = false;
    });
  });

  // ---------------------------------------------------------------- прочее
  function tourRowHtml(t) {
    return (
      '<article class="tt-tour' + (t.is_bookable ? "" : " is-pending") + '">' +
        "<div>" +
          "<strong>" + esc(t.name) + "</strong>" +
          '<div class="tt-muted-note">' + esc(t.destination) +
            (t.note ? " · " + esc(t.note) : "") + "</div>" +
        "</div>" +
        '<div class="tt-tour-commission">' +
          (t.agency_commission > 0
            ? '<span class="tt-earn-value">' + money(t.agency_commission) + "</span>" +
              '<span class="tt-muted-note">с туриста</span>'
            : '<span class="tt-muted-note">без комиссии</span>') +
        "</div>" +
        "<div>" +
          (t.is_bookable
            ? '<span class="tt-badge">Открыт</span>'
            : '<span class="tt-badge tt-badge-off">Скоро</span>') +
        "</div>" +
      "</article>"
    );
  }

  function loadTours() {
    return TuronApi.tours().then(function (list) {
      $("tours-list").innerHTML = list.map(tourRowHtml).join("") +
        '<p class="tt-muted-note" style="margin-top:16px">' +
        "Комиссия начисляется за каждого проданного туриста. Младенцы до 2 лет " +
        "не занимают место и продажей не считаются.</p>";
    }).catch(function () {
      $("tours-list").innerHTML = '<div class="tt-empty-state">Не удалось загрузить туры.</div>';
    });
  }

  function switchTab(name) {
    document.querySelectorAll(".tt-tab").forEach(function (t) {
      t.classList.toggle("is-active", t.dataset.tab === name);
    });
    ["departures", "bookings", "tours", "manifest", "admin-bookings", "agencies"]
      .forEach(function (key) {
        var panel = $("panel-" + key);
        if (panel) panel.hidden = key !== name;
      });
  }

  document.querySelector(".tt-tabs").addEventListener("click", function (e) {
    var tab = e.target.closest(".tt-tab");
    if (tab) switchTab(tab.dataset.tab);
  });

  function flash(text) {
    var el = document.createElement("div");
    el.className = "tt-flash";
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function () { el.classList.add("is-out"); }, 3200);
    setTimeout(function () { el.remove(); }, 3800);
  }

  // ----------------------------------------------------------------- старт
  if (TuronApi.isDemo()) {
    var hint = $("demo-hint");
    hint.hidden = false;
    hint.innerHTML = "Демо-режим: бэкенд не подключён, данные хранятся в браузере.<br>" +
      "Логины: <strong>" + TuronApi.demoLogins.join("</strong>, <strong>") +
      "</strong> · пароль <strong>" + TuronApi.demoPassword + "</strong>";
  }

  if (TuronApi.isLoggedIn()) {
    TuronApi.me().then(function (res) { showApp(res.agency); }).catch(showLogin);
  } else {
    showLogin();
  }
})();

</script>
