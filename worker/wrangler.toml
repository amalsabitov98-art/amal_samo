name = "turon-tour-api"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
# Адрес кабинета. Пока пусто — API отвечает любому источнику, что на бою
# небезопасно: сторонняя страница сможет обращаться к API от имени
# залогиненного пользователя. После деплоя указать реальный адрес,
# например "https://amalsabitov98-art.github.io".
ALLOWED_ORIGIN = "https://amalsabitov98-art.github.io"

# База агентского кабинета. Создать один раз:
#   wrangler d1 create turon-tour
# и подставить выданный database_id сюда.
[[d1_databases]]
binding = "DB"
database_name = "turon-tour"
database_id = "72e6c295-75e2-43cc-adc3-9ec2b38bad21"

# Развёртывание:
#   wrangler d1 execute turon-tour --remote --file=../db/schema.sql
#   wrangler d1 execute turon-tour --remote --file=../db/seed.sql
#   wrangler deploy
