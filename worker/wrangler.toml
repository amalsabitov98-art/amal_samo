name = "turon-tour-api"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
# Адрес кабинета. Пока пусто — API отвечает любому источнику, что на бою
# небезопасно: сторонняя страница сможет обращаться к API от имени
# залогиненного пользователя. После деплоя указать реальный адрес,
# например "https://amalsabitov98-art.github.io".
ALLOWED_ORIGIN = "https://amalsabitov98-art.github.io"

# Уведомления оператору в Telegram: новая бронь и заявка на отмену. Пока не
# заданы ОБЕ строки (токен и chat_id) — уведомления просто не шлются, всё
# остальное работает как прежде.
#   1) создать бота у @BotFather, получить токен;
#   2) узнать chat_id: НАПИСАТЬ БОТУ /start в личку (бот не может написать
#      первым), затем взять свой id у @userinfobot; либо добавить бота в
#      группу и взять её id — он начинается с минуса;
#   3) chat_id — сюда (не секрет), а токен — секретом, НЕ в git:
#        cd worker && wrangler secret put TELEGRAM_BOT_TOKEN
#   4) wrangler deploy
# Можно указать НЕСКОЛЬКО id через запятую — например обоих менеджеров:
#   TELEGRAM_CHAT_ID = "110907260,1180697546"
# Сейчас это группа «Etihad — брони», в ней оба менеджера и бот.
TELEGRAM_CHAT_ID = "-1004306422816"

# Заявки с публичной формы «Свяжитесь с нами» (сайт → шеф) — СВОЙ бот и чат,
# независимые от бота с бронями выше: это разные адресаты и разные интересы
# (шефу заявки на индивидуальный тур, оператору — брони по готовым
# программам). Настройка та же схема, но отдельная пара переменных:
#   1) создать ВТОРОГО бота у @BotFather (или использовать чат с шефом другим
#      способом — токен всё равно нужен свой, Telegram Bot API работает так);
#   2) узнать chat_id так же — личка шефа с ботом или id группы;
#   3) cd worker && wrangler secret put CONTACT_TELEGRAM_BOT_TOKEN
#   4) wrangler deploy
# Можно указать НЕСКОЛЬКО id через запятую — сообщение уйдёт всем сразу.
# Пробелы вокруг запятой не важны.
#
# Сейчас заявки идут В ТУ ЖЕ ГРУППУ, что и брони, и бот тоже один. Разными
# они задуманы на случай, когда адресаты разойдутся; пока адресат один,
# держать два бота незачем — CONTACT_TELEGRAM_BOT_TOKEN просто хранит тот
# же токен.
#
# Прежние личные id (110907260, 1180697546) убраны намеренно: бот не может
# написать человеку, который сам не нажал ему Start. С новым ботом эти
# адреса молча отваливались бы по 403, а ошибку мы глушим — заявки просто
# не приходили бы, и понять причину было бы неоткуда. Вернуть их можно в
# любой момент: каждый получатель открывает бота, жмёт Start, и его id
# дописывается сюда через запятую.
CONTACT_TELEGRAM_CHAT_ID = "-1004306422816"

# База агентского кабинета. Создать один раз:
#   wrangler d1 create turon-tour
# и подставить выданный database_id сюда.
[[d1_databases]]
binding = "DB"
database_name = "turon-tour"
database_id = "72e6c295-75e2-43cc-adc3-9ec2b38bad21"

# Фотографии, которые оператор загружает из кабинета: заглавный кадр тура и
# плитка направления. Раздаются ЧЕРЕЗ ВОРКЕР (/api/media/<ключ>), а не
# публичным адресом: не нужен ни отдельный домен, ни настройка публичного
# доступа, а Cloudflare всё равно кэширует ответ на краю.
#
# Хранилищ поддерживается ДВА, воркер берёт то, которое подключено:
#
#   1. R2 (предпочтительно — это хранилище файлов, для того и сделано).
#      Требует РАЗОВОГО включения в панели Cloudflare: dash.cloudflare.com →
#      R2 → Enable. Без этого `wrangler r2 bucket create` отвечает
#      «Please enable R2 through the Cloudflare Dashboard [code: 10042]».
#      После включения:
#          wrangler r2 bucket create turon-media
#      и раскомментировать блок ниже.
#
#   2. KV — запасной путь, включать ничего не нужно, он входит в Workers.
#      Для нескольких десятков снимков по 300 КБ его бесплатного объёма
#      хватает с большим запасом. Создать и вписать выданный id:
#          wrangler kv namespace create MEDIA_KV
#
# ВАЖНО: бинд на несуществующий бакет РОНЯЕТ `wrangler deploy` целиком —
# не выкатывается ничего, включая правки, к фотографиям не относящиеся.
# Поэтому оба блока закомментированы, пока хранилище не заведено.
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "turon-media"
#
# [[kv_namespaces]]
# binding = "MEDIA_KV"
# id = "сюда id из wrangler kv namespace create"

# Развёртывание:
#   wrangler d1 execute turon-tour --remote --file=../db/schema.sql
#   wrangler d1 execute turon-tour --remote --file=../db/seed.sql
#   wrangler deploy
